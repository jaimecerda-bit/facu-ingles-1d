  <title>FACU INGLÉS 1D Pro Mobile</title>
  <style>

    .profiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:14px;margin-bottom:18px}.profile-card,.add-card{background:#fff;border:2px solid #eef0f7;border-radius:24px;padding:16px;box-shadow:0 10px 24px #17203314;text-align:center;transition:.2s transform,.2s border-color}.profile-card:active,.add-card:active{transform:scale(.97)}.profile-card:hover{border-color:var(--primary)}
    .avatar{width:72px;height:72px;margin:0 auto 10px;border-radius:24px;display:grid;place-items:center;font-size:42px;background:linear-gradient(135deg,#eef2ff,#ffe3ef)}.profile-name{font-weight:900;font-size:1.08rem}.profile-meta{margin-top:8px;color:var(--muted);font-size:.9rem;font-weight:800;display:flex;justify-content:center;gap:10px}.delete-mini{margin-top:10px;background:#fff1f1;color:var(--danger);border-radius:14px;padding:8px 10px;font-size:.85rem;font-weight:900}
    .form-card{background:linear-gradient(135deg,#F8FAFF,#FFF7FB);border:2px dashed #c7d2fe;border-radius:26px;padding:18px}.input{width:100%;border:2px solid #e5e7eb;border-radius:18px;padding:16px 18px;font-weight:900;font-size:1.1rem;outline:none;background:#fff}.input:focus{border-color:var(--primary);box-shadow:0 0 0 5px #6d5df620}.avatar-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:14px 0}.avatar-choice{aspect-ratio:1;border-radius:18px;background:#fff;border:2px solid #eef0f7;font-size:30px;display:grid;place-items:center}.avatar-choice.selected{border-color:var(--primary);background:#efeefe;box-shadow:0 0 0 4px #6d5df61c}.primary-btn,.secondary-btn,.ghost-btn{border-radius:20px;padding:15px 18px;font-weight:950;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px}.primary-btn{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;box-shadow:0 12px 26px #6d5df633}.secondary-btn{background:#fff;color:var(--primary);border:2px solid #e7e7ff}.ghost-btn{background:#f4f5fb;color:var(--ink)}.full{width:100%}
    .topbar{background:linear-gradient(135deg,#4230D8,#8C54FF 55%,#FF66A3);color:white;padding:18px 18px 22px}.user-row{display:flex;align-items:center;justify-content:space-between;gap:12px}.user-mini{display:flex;align-items:center;gap:12px;min-width:0}.user-mini .avatar{width:58px;height:58px;margin:0;font-size:34px;border-radius:20px;background:#fff;color:var(--ink)}.hello{font-size:.92rem;opacity:.9;font-weight:800}.user-title{font-size:1.25rem;font-weight:950;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.top-actions{display:flex;gap:8px}.icon-btn{width:48px;height:48px;border-radius:17px;background:#ffffff22;color:#fff;border:1px solid #ffffff55;font-size:22px;display:grid;place-items:center}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}.stat{background:#ffffff22;border:1px solid #ffffff55;border-radius:20px;text-align:center;padding:12px 8px}.stat b{font-size:1.45rem;display:block}.stat span{font-size:.72rem;font-weight:900;opacity:.95;text-transform:uppercase;letter-spacing:.04em}

    .content{padding:18px;background:#FAFBFF}.path-header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}.path-header h2{font-size:1.5rem;letter-spacing:-.03em}.path-header p{color:var(--muted);font-weight:800;margin-top:4px}.progress-pill{background:#fff;border:1px solid #edf0f8;border-radius:999px;padding:10px 12px;font-weight:950;color:var(--primary);white-space:nowrap}

    .activity{max-width:860px;margin:0 auto}.lesson-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.lesson-head-left{display:flex;align-items:center;gap:12px}.mini-icon{width:56px;height:56px;border-radius:20px;display:grid;place-items:center;font-size:32px;background:linear-gradient(135deg,#eef2ff,#fff0f6)}.lesson-head h2{font-size:1.22rem}.lesson-head p{font-size:.9rem;color:var(--muted);font-weight:800}.stepbar{height:12px;background:#e9ecf5;border-radius:999px;overflow:hidden;margin:12px 0 18px}.stepbar>div{height:100%;width:0;background:linear-gradient(90deg,var(--primary),var(--secondary));border-radius:inherit;transition:.3s width}.card{background:#fff;border:1px solid #edf0f8;border-radius:30px;padding:20px;box-shadow:0 14px 35px #17203314}.flash-main{text-align:center}.big-emoji{font-size:clamp(5rem,22vw,9rem);line-height:1;margin:8px 0 10px;display:inline-block;animation:bounceIn .55s cubic-bezier(.28,1.6,.5,1) both}@keyframes bounceIn{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}.word{font-size:clamp(2.2rem,10vw,4.4rem);font-weight:1000;letter-spacing:-.05em;color:#21175f}.phonetic{display:inline-block;margin:10px 0 8px;background:#f5f3ff;color:#5b21b6;border-radius:999px;padding:10px 15px;font-weight:950}.translation{font-size:1.5rem;font-weight:950;color:var(--ink);margin-bottom:10px}.phrase{font-size:1rem;color:var(--muted);font-weight:850;background:#f8fafc;border-radius:18px;padding:12px;margin-top:10px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.question{text-align:center;font-size:clamp(1.45rem,6vw,2.2rem);font-weight:1000;letter-spacing:-.04em;margin-bottom:12px}.options{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}.option{background:#fff;border:2px solid #e9ecf5;border-radius:22px;padding:16px;min-height:74px;font-weight:950;font-size:1.04rem;box-shadow:0 8px 18px #1720330f;transition:transform .15s,border-color .2s}.option:active{transform:scale(.97)}.option.correct{border-color:var(--success);background:#ecfdf5;color:#087f5b;animation:pulseGood .5s}.option.wrong{border-color:var(--danger);background:#fff5f5;color:#c92a2a;animation:shake .4s}@keyframes pulseGood{50%{transform:scale(1.05)}}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}.feedback{margin-top:14px;border-radius:22px;padding:14px;text-align:center;font-weight:1000;display:none}.feedback.show{display:block;animation:bounceIn .4s}.feedback.good{background:#ecfdf5;color:#087f5b}.feedback.bad{background:#fff5f5;color:#c92a2a}.memory-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}.mem{aspect-ratio:1;border-radius:22px;background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;font-size:clamp(1rem,6vw,2.2rem);font-weight:1000;display:grid;place-items:center;text-align:center;padding:8px;box-shadow:0 10px 20px #1720331a;transition:transform .18s}.mem.flipped{background:#fff;color:var(--ink);border:2px solid var(--primary);transform:rotateY(0)}.mem.matched{background:#ecfdf5;color:#087f5b;border:2px solid var(--success);animation:pulseGood .5s}.sentence-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0}.tile{background:#f3f4f8;border-radius:16px;padding:12px 14px;font-weight:1000;transition:transform .15s,opacity .2s}.tile:active{transform:scale(.95)}.dropzone{min-height:70px;background:#fff;border:2px dashed #cdd3e6;border-radius:22px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;color:#9ca3af;font-weight:800}.dropzone .tile{background:linear-gradient(135deg,#eef2ff,#fef3f9);color:var(--ink)}.game-note{text-align:center;color:var(--muted);font-weight:850;margin:8px 0 12px}.bottom-nav{display:flex;gap:10px;margin-top:16px}.bottom-nav button{flex:1}.coach{position:fixed;right:16px;bottom:calc(16px + var(--safe-bottom));z-index:20;width:62px;height:62px;border-radius:22px;background:linear-gradient(135deg,#FFD43B,#FF66A3);box-shadow:0 18px 32px #17203333;border:3px solid #fff;font-size:30px}.toast{position:fixed;left:50%;bottom:calc(92px + var(--safe-bottom));transform:translateX(-50%) translateY(20px);z-index:30;background:#171F35;color:#fff;padding:12px 16px;border-radius:999px;font-weight:900;opacity:0;pointer-events:none;transition:.25s;max-width:92%;text-align:center}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.library-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}.word-mini{background:#fff;border:1px solid #edf0f8;border-radius:22px;padding:14px;text-align:center}.word-mini .e{font-size:2.4rem}.word-mini b{display:block;margin-top:5px}.word-mini span{color:var(--muted);font-size:.85rem;font-weight:800}.practice-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.practice-card{background:#fff;border:1px solid #edf0f8;border-radius:26px;padding:18px;box-shadow:0 12px 28px #17203312}.practice-card h3{font-size:1.05rem;margin:8px 0 6px}.practice-card p{color:var(--muted);font-weight:800;font-size:.9rem}.audio-badge{display:inline-flex;align-items:center;gap:6px;background:#eef2ff;color:#4338ca;border-radius:999px;padding:8px 11px;font-weight:950;font-size:.8rem;margin-top:10px}.quick-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin-top:10px}.parent-card{background:#fff;border:1px solid #edf0f8;border-radius:28px;padding:18px;box-shadow:0 12px 28px #17203312}.parent-card h3{font-size:1.2rem;margin-bottom:10px}.parent-card ul{padding-left:18px;color:#4b5563;font-weight:750;line-height:1.55}.confetti{position:fixed;top:-18px;width:12px;height:12px;border-radius:4px;z-index:50;animation:fall 2.8s linear forwards}@keyframes fall{to{transform:translateY(110dvh) rotate(720deg);opacity:0}}

    /* NEW GAME STYLES */
    .game-modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
    .game-mode{background:#fff;border:2px solid #eef0f7;border-radius:22px;padding:16px;text-align:center;cursor:pointer;transition:transform .15s,border-color .2s,box-shadow .2s;box-shadow:0 8px 18px #1720330f}
    .game-mode:active{transform:scale(.97)}
    .game-mode:hover{border-color:var(--primary);box-shadow:0 12px 26px #6d5df622}
    .game-mode .icon{font-size:2.6rem;margin-bottom:6px;display:block}
    .game-mode b{display:block;font-size:1rem;margin-bottom:3px}
    .game-mode small{color:var(--muted);font-weight:800;font-size:.78rem}
    /* Tap-the-thing scene */
    .scene{position:relative;background:linear-gradient(180deg,#dbeafe 0%,#fef3c7 70%,#bbf7d0 100%);border-radius:24px;padding:18px;min-height:280px;overflow:hidden}
    .scene-prompt{background:#fff;border-radius:18px;padding:14px;text-align:center;font-weight:950;font-size:1.1rem;margin-bottom:12px;box-shadow:0 6px 16px #1720331a}
    .scene-objects{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:12px}
    .scene-obj{background:#fff;border:2px solid #fff;border-radius:20px;aspect-ratio:1;display:grid;place-items:center;font-size:3.2rem;cursor:pointer;transition:transform .15s,border-color .2s;box-shadow:0 8px 16px #1720331a}
    .scene-obj:active{transform:scale(.92)}
    .scene-obj.correct{border-color:var(--success);background:#ecfdf5;animation:pulseGood .5s}
    .scene-obj.wrong{border-color:var(--danger);background:#fff5f5;animation:shake .4s}
    .scene-obj.faded{opacity:.35;pointer-events:none}
    /* Speak game */
    .mic-circle{width:140px;height:140px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--secondary));margin:14px auto;display:grid;place-items:center;font-size:60px;color:#fff;box-shadow:0 18px 40px #6d5df644;cursor:pointer;transition:transform .2s}
    .mic-circle:active{transform:scale(.94)}
    .mic-circle.listening{animation:pulseRing 1.2s infinite}
    @keyframes pulseRing{0%{box-shadow:0 0 0 0 #ff66a366}70%{box-shadow:0 0 0 24px #ff66a300}100%{box-shadow:0 0 0 0 #ff66a300}}
    .speak-target{font-size:clamp(2rem,9vw,3.6rem);font-weight:1000;text-align:center;color:#21175f;letter-spacing:-.04em;margin:8px 0}
    .speak-result{margin-top:12px;text-align:center;font-weight:900;color:var(--muted);min-height:24px}
    /* Categorize */
    .cat-board{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
    .cat-bin{background:#fff;border:2px dashed #cdd3e6;border-radius:22px;padding:14px;min-height:160px}
    .cat-bin h4{font-size:1rem;margin-bottom:8px;text-align:center}
    .cat-bin .items{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
    .cat-bin.over{border-color:var(--primary);background:#efeefe}
    .cat-tray{background:#f4f5fb;border-radius:22px;padding:12px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px;min-height:80px}
    .cat-pill{background:#fff;border:2px solid #e9ecf5;border-radius:16px;padding:10px 14px;font-weight:950;font-size:.95rem;cursor:grab;user-select:none;box-shadow:0 4px 10px #1720330f;transition:transform .15s}
    .cat-pill:active{cursor:grabbing;transform:scale(1.05)}
    .cat-pill.placed{background:#ecfdf5;border-color:var(--success);color:#087f5b}
    .cat-pill.dragging{opacity:.4}
    /* Speed round */
    .speed-bar{display:flex;align-items:center;gap:10px;background:#fff;border-radius:18px;padding:10px 14px;margin-bottom:10px;box-shadow:0 8px 18px #1720330f}
    .speed-timer{flex:1;height:14px;background:#fef2f2;border-radius:999px;overflow:hidden}
    .speed-timer>div{height:100%;background:linear-gradient(90deg,var(--success),var(--warning),var(--danger));border-radius:inherit;transition:width .1s linear}
    .speed-lives{font-size:1.2rem;font-weight:1000;color:var(--danger);letter-spacing:2px}
    .speed-score{font-weight:1000;color:var(--primary);font-size:1.2rem}
    /* Dialog game */
    .dialog-bubble{background:#fff;border-radius:22px;padding:14px 18px;margin:8px 0;max-width:80%;box-shadow:0 6px 14px #1720331a;animation:slideIn .35s}
    .dialog-bubble.them{background:linear-gradient(135deg,#eef2ff,#fef3f9);align-self:flex-start;border-bottom-left-radius:6px}
    .dialog-bubble.you{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;align-self:flex-end;border-bottom-right-radius:6px;margin-left:auto}
    @keyframes slideIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .dialog-area{display:flex;flex-direction:column;gap:6px;background:#f8fafc;border-radius:22px;padding:14px;min-height:200px;max-height:340px;overflow-y:auto;margin-bottom:12px}
    .dialog-char{display:flex;align-items:center;gap:8px;font-weight:900;font-size:.85rem;color:var(--muted);margin-top:6px}
    .dialog-char .pic{font-size:1.6rem}
    .dialog-replies{display:grid;gap:8px}
    .reply-btn{background:#fff;border:2px solid #e9ecf5;border-radius:18px;padding:14px;text-align:left;font-weight:950;display:flex;align-items:center;gap:10px;transition:transform .15s,border-color .2s}
    .reply-btn:active{transform:scale(.98)}
    .reply-btn .flag{font-size:1.4rem}
    .reply-btn .es{color:var(--muted);font-weight:800;font-size:.85rem;display:block;margin-top:2px}
    .reply-btn.correct{border-color:var(--success);background:#ecfdf5}
    .reply-btn.wrong{border-color:var(--danger);background:#fff5f5}
    /* Audio match (memory mejorado) */
    .audio-mem-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
    .audio-mem{aspect-ratio:1;border-radius:22px;background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;font-size:2.4rem;font-weight:1000;display:grid;place-items:center;cursor:pointer;box-shadow:0 10px 20px #1720331a;transition:transform .15s}
    .audio-mem:active{transform:scale(.94)}
    .audio-mem.revealed{background:#fff;color:var(--ink);border:2px solid var(--primary)}
    .audio-mem.matched{background:#ecfdf5;border:2px solid var(--success);color:#087f5b;animation:pulseGood .5s}
    /* Hearts/lives indicator */
    .lives-row{display:flex;justify-content:center;gap:6px;margin:8px 0}
    .heart{font-size:1.3rem;transition:transform .3s,opacity .3s}
    .heart.lost{opacity:.25;transform:scale(.7)}
    /* Star rating final */
    .stars-row{display:flex;justify-content:center;gap:8px;margin:14px 0}
    .star-big{font-size:3rem;opacity:.25;transform:scale(.7);transition:opacity .4s,transform .4s}

function $(id){return document.getElementById(id)}
function appState(){return JSON.parse(localStorage.getItem(STORE)||'{"users":[]}')}
function saveState(s){localStorage.setItem(STORE,JSON.stringify(s))}
function userData(){return currentUser?.data||{stars:0,badges:0,completed:[],streak:0,lastDay:null,wordsSeen:{}}}
function setCurrentUser(u){currentUser=u;localStorage.setItem(STORE+'_current',u?u.id:'')}
function persistUser(){const s=appState();const idx=s.users.findIndex(u=>u.id===currentUser.id);if(idx>=0){s.users[idx]=currentUser;saveState(s)}}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.remove('show'),2200)}

   - speakMixed: divide texto con marcadores [[en]]...[[/en]] y reproduce cada parte con la voz correcta
   ============================================================ */
let cachedVoices=[];
function refreshVoices(){if('speechSynthesis'in window){cachedVoices=window.speechSynthesis.getVoices()||[]}}
if('speechSynthesis'in window){refreshVoices();window.speechSynthesis.onvoiceschanged=refreshVoices}

function preferredVoice(lang){
  refreshVoices();
  const prefix=lang.slice(0,2).toLowerCase();
  // Prioritize high-quality voices for English
  if(prefix==='en'){
    // Look for natural/enhanced voices first
    const premium=cachedVoices.find(v=>v.lang&&v.lang.toLowerCase().startsWith('en')&&/(samantha|alex|google.*us|microsoft.*zira|microsoft.*aria|natural|enhanced|premium)/i.test(v.name));
    if(premium)return premium;
    const usFemale=cachedVoices.find(v=>v.lang&&v.lang.toLowerCase()==='en-us'&&/female|woman|zira|samantha|aria|jenny/i.test(v.name));
    if(usFemale)return usFemale;
    const us=cachedVoices.find(v=>v.lang&&v.lang.toLowerCase()==='en-us');
    if(us)return us;
  }
  if(prefix==='es'){
    const cl=cachedVoices.find(v=>v.lang&&v.lang.toLowerCase()==='es-cl');
    if(cl)return cl;
    const es=cachedVoices.find(v=>v.lang&&v.lang.toLowerCase().startsWith('es'));
    if(es)return es;
  }
  const exact=cachedVoices.find(v=>v.lang&&v.lang.toLowerCase()===lang.toLowerCase());
  if(exact)return exact;
  const native=cachedVoices.find(v=>v.lang&&v.lang.toLowerCase().startsWith(prefix));
  return native||null;
}

function speak(text,lang='en-US',rate=null){
  return new Promise(res=>{
    try{
      if(!('speechSynthesis'in window)){toast(text);return res()}
      speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(text);
      u.lang=lang;
      const v=preferredVoice(lang);
      if(v)u.voice=v;
      // Rates tuned for clarity for kids
      u.rate=rate||(lang.startsWith('en')?.78:.92);
      u.pitch=lang.startsWith('en')?1.05:1.1;
      u.volume=1;
      u.onend=res;
      u.onerror=res;
      speechSynthesis.speak(u);
    }catch(e){res()}
  });
}
function speakEN(text,rate){return speak(text,'en-US',rate)}
function speakES(text,rate){return speak(text,'es-CL',rate)}

// Pronuncia texto mixto. Usa [[en]]...[[/en]] dentro de un texto en español
// para palabras/frases que deben sonar en inglés.
async function speakMixed(text){
  // Si no hay marcadores, intentar en español por defecto
  if(!text.includes('[[en]]'))return speakES(text);
  const parts=text.split(/(\[\[en\]\][\s\S]*?\[\[\/en\]\])/g).filter(Boolean);
  for(const p of parts){
    if(p.startsWith('[[en]]')){
      const inner=p.replace(/^\[\[en\]\]/,'').replace(/\[\[\/en\]\]$/,'').trim();
      if(inner)await speakEN(inner);
    }else{
      const t=p.trim();
      if(t)await speakES(t);
    }
  }
}

// Helper: di la palabra/frase con introducción bilingüe

  await speakEN(en);
  await new Promise(r=>setTimeout(r,250));

}

function normalize(str){return String(str).replace(/'/g,'&#39;').replace(/"/g,'&quot;')}

/* ============================================================
   AUDIO FEEDBACK SOUNDS (Web Audio API)
   ============================================================ */
let audioCtx=null;
function getCtx(){if(!audioCtx){try{audioCtx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}return audioCtx}
function playTone(freq,duration=120,type='sine',vol=.18){
  const ctx=getCtx();if(!ctx)return;
  try{
    const osc=ctx.createOscillator();const g=ctx.createGain();
    osc.type=type;osc.frequency.value=freq;
    g.gain.value=vol;g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+duration/1000);
    osc.connect(g);g.connect(ctx.destination);
    osc.start();osc.stop(ctx.currentTime+duration/1000);
  }catch(e){}
}
function sfxCorrect(){playTone(660,120,'sine',.18);setTimeout(()=>playTone(880,160,'sine',.16),100);setTimeout(()=>playTone(1100,200,'sine',.14),250)}
function sfxWrong(){playTone(220,200,'sawtooth',.14);setTimeout(()=>playTone(180,260,'sawtooth',.12),150)}
function sfxTap(){playTone(440,60,'triangle',.1)}
function sfxLevelUp(){const notes=[523,659,784,1047];notes.forEach((f,i)=>setTimeout(()=>playTone(f,180,'sine',.18),i*120))}

}

function startLesson(id){
  currentLesson=LESSONS.find(l=>l.id===id);
  stepIndex=0;sessionScore=0;comboCount=0;sessionLives=3;
  showStep();
  // Intro bilingüe: español primero (contexto), inglés después (palabras clave en su voz)
  speakES('Lección: '+currentLesson.title).then(()=>{
    setTimeout(()=>speakEN("Let's learn "+currentLesson.titleEn+"!"),200);
  });
}

function stepsForLesson(){
  // Flow: flashcards de cada palabra → escuchar → tap-the-thing → memorice → ordenar frase → diálogo (si existe) → completar
  const flashes=currentLesson.words.map((_,i)=>({type:'flash',idx:i}));
  const games=[{type:'listen'},{type:'tap'},{type:'match'},{type:'sentence'}];
  if(currentLesson.dialog&&currentLesson.dialog.length)games.push({type:'dialog'});
  // For greetings/about-me, agregar speed round extra
  if(['greetings','about-me','classroom'].includes(currentLesson.id))games.push({type:'speed'});
  games.push({type:'complete'});
  return flashes.concat(games);
}

function showStep(){
  const steps=stepsForLesson();const step=steps[stepIndex];
  const pct=Math.round((stepIndex/Math.max(1,steps.length-1))*100);
  $('content').innerHTML=`<div class="activity"><div class="lesson-head"><div class="lesson-head-left"><div class="mini-icon">${currentLesson.icon}</div><div><h2>${currentLesson.title}</h2><p>${currentLesson.titleEn} · Paso ${Math.min(stepIndex+1,steps.length)} de ${steps.length}</p></div></div><button class="secondary-btn" onclick="showHome()">Menú</button></div><div class="stepbar"><div style="width:${pct}%"></div></div><div id="activityBody"></div></div>`;
  if(step.type==='flash')renderFlash(step.idx);
  else if(step.type==='listen')renderListenGame();
  else if(step.type==='tap')renderTapGame();
  else if(step.type==='match')renderMatchGame();
  else if(step.type==='sentence')renderSentenceGame();
  else if(step.type==='dialog')renderDialogGame();
  else if(step.type==='speed')renderSpeedGame();
  else if(step.type==='complete')renderComplete();
  updateStats();
}

async function tapAnswer(el,key){

      showFeedback(true,'¡Excelente! '+window.tapHits+' correctas');

function renderMatchGame(){
  const pairs=shuffled(currentLesson.words).slice(0,4);
  const cards=shuffled(pairs.flatMap(v=>[{id:v.en,show:v.icon,type:'icon'},{id:v.en,show:v.en,type:'word'}]));

  $('activityBody').innerHTML=`<section class="card">

    <div class="memory-grid">${cards.map((c,i)=>`<button class="mem" data-id="${normalize(c.id)}" data-show="${normalize(c.show)}" data-type="${c.type}" onclick="flipMem(this)">?</button>`).join('')}</div>

async function flipMem(el){
  if(el.classList.contains('matched')||el.classList.contains('flipped')||memoryState.open.length>=2)return;
  el.textContent=el.dataset.show;el.classList.add('flipped');sfxTap();
  // Si es una carta de palabra (texto inglés), reproducir audio en inglés. Si es icono, también lo reproducimos para reforzar.
  speakEN(el.dataset.id);
  memoryState.open.push(el);
  if(memoryState.open.length===2){memoryState.moves++;setTimeout(checkMem,750)}
}
async function checkMem(){
  const[a,b]=memoryState.open;
  if(a.dataset.id===b.dataset.id){
    a.classList.add('matched');b.classList.add('matched');
    memoryState.matched+=2;reward(5);sfxCorrect();vibrate([20,30,20]);
    comboCount++;
    if(comboCount>=2)comboPop('✨ '+a.dataset.id);
    await speakEN('Great match! '+a.dataset.id);
    if(memoryState.matched===memoryState.total){
      const stars=memoryState.moves<=6?3:memoryState.moves<=8?2:1;
      showFeedback(true,'¡Todas las parejas! '+ '⭐'.repeat(stars));
      $('nextGame').classList.remove('hidden');
      sfxLevelUp();confetti();
    }
  }else{
    sfxWrong();
    a.classList.remove('flipped');b.classList.remove('flipped');
    a.textContent='?';b.textContent='?';
    comboCount=0;
  }
  memoryState.open=[];
}

   GAME 5: DIÁLOGO INTERACTIVO (responde como en una conversación)
   ============================================================ */
let dialogState=null;
function renderDialogGame(){
  if(!currentLesson.dialog||!currentLesson.dialog.length){nextStep();return}
  dialogState={turn:0,history:[],dialogs:shuffled([...currentLesson.dialog])};
  showDialogTurn();
}
async function showDialogTurn(){
  if(dialogState.turn>=dialogState.dialogs.length){
    showFeedback(true,'¡Conversación completa!');
    $('activityBody').innerHTML+=`<div style="text-align:center;margin-top:14px"><button class="primary-btn" onclick="nextStep()">Siguiente →</button></div>`;
    sfxLevelUp();confetti();
    return;
  }
  const d=dialogState.dialogs[dialogState.turn];
  $('activityBody').innerHTML=`<section class="card">
    <div class="question">💬 Conversación</div>
    <p class="game-note">Escucha y responde. Audio 100% en inglés.</p>
    <div class="dialog-area" id="dialogArea">
      ${dialogState.history.map(h=>`<div class="dialog-char"><span class="pic">${h.charPic}</span>${h.charName}</div><div class="dialog-bubble ${h.side}">${h.text}</div>`).join('')}
      <div class="dialog-char"><span class="pic">${d.char.split(' ')[0]}</span>${d.char}</div>
      <div class="dialog-bubble them" id="themBubble">${d.en}<br><small style="opacity:.7">${d.es}</small></div>
    </div>
    <button class="secondary-btn full" onclick="speakEN('${normalize(d.en)}')">🔊 Escuchar otra vez</button>
    <div class="dialog-replies" style="margin-top:12px">
      ${shuffled([...d.replies]).map((r,i)=>`<button class="reply-btn" onclick="pickReply(this,${r.ok?1:0},'${normalize(r.en)}','${normalize(r.es)}')"><span class="flag">🇺🇸</span><div><b>${r.en}</b><span class="es">${r.es}</span></div></button>`).join('')}
    </div>
    <div id="feedback" class="feedback"></div>
    <div class="bottom-nav">
      <button class="ghost-btn" onclick="prevStep()">← Atrás</button>
    </div>
  </section>`;
  setTimeout(()=>speakEN(d.en),300);
}
async function pickReply(el,ok,en,es){
  document.querySelectorAll('.reply-btn').forEach(b=>b.disabled=true);
  el.classList.add(ok?'correct':'wrong');
  const d=dialogState.dialogs[dialogState.turn];
  if(ok){
    sfxCorrect();vibrate([20,40,20]);reward(15);
    dialogState.history.push({charName:d.char,charPic:d.char.split(' ')[0],text:d.en+'<br><small style="opacity:.7">'+d.es+'</small>',side:'them'});
    dialogState.history.push({charName:'You',charPic:'🧒',text:en+'<br><small style="opacity:.7">'+es+'</small>',side:'you'});
    await speakEN(en);
    showFeedback(true,'¡Buena respuesta!');
    setTimeout(()=>{dialogState.turn++;showDialogTurn()},900);
  }else{
    sfxWrong();vibrate(150);comboCount=0;
    showFeedback(false,'Esa no es la mejor respuesta. Intenta otra.');
    await speakES('Intenta con otra respuesta.');
    setTimeout(()=>{document.querySelectorAll('.reply-btn').forEach(b=>{if(!b.classList.contains('wrong'))b.disabled=false});el.disabled=true},900);
  }
}

/* ============================================================
   GAME 6: SPEED ROUND — contra reloj con vidas
   ============================================================ */
let speedState=null;
function renderSpeedGame(){
  speedState={score:0,lives:3,timeLeft:30,timer:null,deadline:Date.now()+30000};
  speedNextRound();
  speedState.timer=setInterval(speedTick,100);
}
function speedNextRound(){
  if(speedState.lives<=0||speedState.timeLeft<=0){speedEnd();return}
  const items=shuffled(currentLesson.words).slice(0,4);
  const correct=items[Math.floor(Math.random()*items.length)];
  speedState.correct=correct.en;
  $('activityBody').innerHTML=`<section class="card">
    <div class="speed-bar">
      <div class="speed-score">⭐ ${speedState.score}</div>
      <div class="speed-timer"><div id="speedTimer" style="width:100%"></div></div>
      <div class="speed-lives" id="speedLives">${'❤️'.repeat(speedState.lives)+'🤍'.repeat(3-speedState.lives)}</div>
    </div>
    <div class="question">⚡ Speed Round</div>
    <p class="game-note">Escucha y elige rápido. Audio 100% en inglés.</p>
    <button class="primary-btn full" onclick="speakEN('${normalize(correct.en)}')">🔊 Repetir</button>
    <div class="options">${items.map(v=>`<button class="option" onclick="speedAnswer(this,'${normalize(v.en)}')"><span style="font-size:2rem;display:block">${v.icon}</span>${v.es}</button>`).join('')}</div>
    <div id="feedback" class="feedback"></div>
    <div class="bottom-nav"><button class="ghost-btn" onclick="speedQuit()">Salir</button></div>
  </section>`;
  setTimeout(()=>speakEN(correct.en),200);
}
function speedTick(){
  if(!speedState)return;
  const left=Math.max(0,speedState.deadline-Date.now())/1000;
  speedState.timeLeft=left;
  const bar=$('speedTimer');
  if(bar)bar.style.width=(left/30*100)+'%';
  if(left<=0)speedEnd();
}
async function speedAnswer(el,key){
  const ok=key===speedState.correct;
  el.classList.add(ok?'correct':'wrong');
  document.querySelectorAll('.option').forEach(o=>o.disabled=true);
  if(ok){
    sfxCorrect();vibrate([15,30]);
    speedState.score+=10;reward(8);
    comboCount++;
    if(comboCount>=3)comboPop('🔥 '+comboCount+'x');
    await speakEN('Yes!');
  }else{
    sfxWrong();vibrate(100);
    speedState.lives--;comboCount=0;
    $('speedLives').textContent='❤️'.repeat(speedState.lives)+'🤍'.repeat(3-speedState.lives);
    await speakES('Era '+currentLesson.words.find(w=>w.en===speedState.correct).es);
  }
  setTimeout(()=>speedNextRound(),500);
}
function speedEnd(){
  if(speedState&&speedState.timer)clearInterval(speedState.timer);
  const score=speedState?speedState.score:0;
  speedState=null;
  $('activityBody').innerHTML=`<section class="card flash-main">
    <div class="big-emoji">⚡</div>
    <div class="word" style="font-size:clamp(1.8rem,7vw,3rem)">¡Speed Round!</div>
    <div class="translation">Puntaje: ${score}</div>
    <div class="phrase">${score>=50?'¡Increíble velocidad!':score>=30?'¡Muy bien!':'Sigue practicando.'}</div>
    <div class="actions">
      <button class="secondary-btn" onclick="renderSpeedGame()">🔁 Otra ronda</button>
      <button class="primary-btn" onclick="nextStep()">Continuar →</button>
    </div>
  </section>`;
  if(score>=30){confetti();sfxLevelUp()}
}
function speedQuit(){if(speedState&&speedState.timer)clearInterval(speedState.timer);speedState=null;nextStep()}

/* ============================================================
   COMPLETAR
   ============================================================ */
function renderComplete(){
  const d=userData();
  if(!d.completed.includes(currentLesson.id)){
    d.completed.push(currentLesson.id);
    d.badges=(d.badges||0)+1;
    d.stars=(d.stars||0)+40;
    const today=todayKey();
    if(d.lastDay!==today){d.streak=(d.streak||0)+1;d.lastDay=today}
    currentUser.data=d;persistUser();
  }
  updateStats();
  // Calcular estrellas según rendimiento (basado en sessionScore aproximado por reward)
  const stars=sessionScore>=120?3:sessionScore>=60?2:1;
  $('activityBody').innerHTML=`<section class="card flash-main">
    <div class="big-emoji">🏆</div>
    <div class="word" style="font-size:clamp(2rem,8vw,3.2rem)">¡Lección completada!</div>
    <div class="translation">${currentLesson.title}</div>
    <div class="stars-row">
      <span class="star-big">⭐</span>
      <span class="star-big">⭐</span>
      <span class="star-big">⭐</span>
    </div>
    <p class="phrase">Ganaste estrellas, una medalla y desbloqueaste la siguiente lección.</p>
    <div class="actions">
      <button class="secondary-btn" onclick="startLesson('${currentLesson.id}')">🔁 Repetir</button>
      <button class="primary-btn" onclick="showHome()">Ruta →</button>
    </div>
  </section>`;
  // Animar estrellas una por una
  const starEls=document.querySelectorAll('.star-big');
  for(let i=0;i<stars;i++){
    setTimeout(()=>{starEls[i].classList.add('shown');playTone(523+i*200,180,'sine',.18)},400+i*350);
  }
  confetti();
  // Mensaje bilingüe: inglés primero (en su voz), luego español
  setTimeout(()=>speakEN('Congratulations! Lesson complete!'),300);
  setTimeout(()=>speakES('¡Felicitaciones! Completaste la lección.'),1800);
}
function reward(points){sessionScore+=points;const d=userData();d.stars=(d.stars||0)+points;currentUser.data=d;persistUser();updateStats()}
function showFeedback(ok,msg){const f=$('feedback');f.className='feedback show '+(ok?'good':'bad');f.textContent=msg||(ok?'✅ Correcto':'❌ Intenta otra vez')}

/* ============================================================
   PRACTICE / LIBRARY / PARENTS
   ============================================================ */
function allWords(){return LESSONS.flatMap(l=>l.words.map(w=>({...w,lesson:l.title,lessonEn:l.titleEn})))}

function showPractice(){
  setTab(1);
  $('content').innerHTML=`<div class="path-header">
    <div><h2>Práctica rápida</h2><p>Elige un mini-juego para practicar palabras de cualquier lección.</p></div>
    <div class="progress-pill">Modo juego</div>
  </div>
  <div class="game-modes">
    <button class="game-mode" onclick="quickGame('flashcards')"><span class="icon">🃏</span><b>Flashcards</b><small>Audio en inglés</small></button>
    <button class="game-mode" onclick="quickGame('listen')"><span class="icon">🎧</span><b>Escucha</b><small>Elige el significado</small></button>
    <button class="game-mode" onclick="quickGame('tap')"><span class="icon">👆</span><b>Tap the thing</b><small>Toca el correcto</small></button>
    <button class="game-mode" onclick="quickGame('memory')"><span class="icon">🧠</span><b>Memorice</b><small>Pares con audio</small></button>
    <button class="game-mode" onclick="quickGame('speed')"><span class="icon">⚡</span><b>Speed Round</b><small>Contra reloj</small></button>
    <button class="game-mode" onclick="quickGame('dialog')"><span class="icon">💬</span><b>Diálogos</b><small>Conversaciones reales</small></button>
  </div>
  <div id="quickArea"></div>`;
}

function quickGame(mode){
  // Crear "lección virtual" con palabras al azar de toda la app
  const words=shuffled(allWords()).slice(0,8);
  const phrases=words.map(w=>w.phrase);
  // dialogs disponibles (mezclados de lecciones que tienen)
  const allDialogs=LESSONS.filter(l=>l.dialog).flatMap(l=>l.dialog);
  currentLesson={
    id:'_quick_'+mode,
    title:'Práctica rápida',
    titleEn:'Quick practice',
    icon:'🎮',
    words,
    phrases,
    dialog:allDialogs.length?shuffled(allDialogs).slice(0,3):null
  };
  // Render solo la actividad pedida en quickArea
  const area=$('quickArea');
  area.innerHTML='<div id="activityBody"></div>';
  // Necesitamos que las funciones de juego escriban en activityBody — ya lo hacen
  if(mode==='flashcards'){renderQuickFlashcards(words);return}
  if(mode==='listen')renderListenGame();
  if(mode==='tap')renderTapGame();
  if(mode==='memory')renderMatchGame();
  if(mode==='speed')renderSpeedGame();
  if(mode==='dialog'){
    if(!currentLesson.dialog){area.innerHTML='<p style="text-align:center;color:var(--muted);font-weight:900;margin-top:14px">Aún no hay diálogos disponibles.</p>';return}
    renderDialogGame();
  }
  // Sustituir botón "Siguiente" por "otra ronda"
  setTimeout(()=>{
    const nb=$('nextGame');
    if(nb){nb.textContent='🎲 Otra ronda';nb.onclick=()=>quickGame(mode)}
  },300);
}

function renderQuickFlashcards(words){
  $('activityBody').innerHTML=`<div class="practice-grid">${words.map((v,i)=>`<article class="practice-card">
    <div style="font-size:2.8rem">${v.icon}</div>
    <h3>${v.en}</h3>
    <p>${v.es} · ${v.lesson}</p>
    <div style="font-family:monospace;color:#5b21b6;background:#f5f3ff;border-radius:10px;padding:6px 10px;display:inline-block;margin:6px 0;font-weight:900">/${v.phonetic}/</div>
    <div class="quick-row">
      <button class="primary-btn" onclick="speakEN('${normalize(v.en)}')">🔊 Palabra</button>
      <button class="secondary-btn" onclick="speakEN('${normalize(v.phrase)}')">Frase</button>
    </div>
  </article>`).join('')}</div>
  <div class="bottom-nav" style="margin-top:14px">
    <button class="ghost-btn" onclick="showPractice()">← Cambiar juego</button>
    <button class="primary-btn" onclick="quickGame('flashcards')">🎲 Otra ronda</button>
  </div>`;
}

function showLibrary(){
  setTab(2);
  const words=allWords();
  $('content').innerHTML=`<div class="path-header">
    <div><h2>Biblioteca de palabras</h2><p>Toca una palabra para escucharla en inglés. Toca dos veces para oírla más despacio.</p></div>
    <div class="progress-pill">${words.length} palabras</div>
  </div>
  <div class="library-grid">${words.map((v,i)=>`<button class="word-mini" ondblclick="speakEN('${normalize(v.en)}',.55)" onclick="speakEN('${normalize(v.en)}')">
    <div class="e">${v.icon}</div>
    <b>${v.en}</b>
    <span>${v.es}</span>
    <small style="display:block;color:#4338ca;font-weight:950;margin-top:6px;font-size:.72rem">/${v.phonetic}/</small>
  </button>`).join('')}</div>`;
}

function showParents(){
  setTab(3);
  $('content').innerHTML=`<div class="parent-card">
    <h3>👨‍👩‍👦 Guía para acompañar el aprendizaje</h3>
    <ul>
      <li>Usar 8 a 12 minutos por sesión, idealmente 4 veces por semana.</li>
      <li>Repetir primero las lecciones de saludos, presentación y sala de clases: son la base de colegio bilingüe.</li>
      <li>Pedirle al niño que diga una frase completa, no solo palabras sueltas: "My name is…", "I am happy", "Thank you".</li>
      <li>Celebrar la pronunciación aproximada; a esta edad importa más la confianza oral que la perfección.</li>
      <li>Usar la sección "Diálogos" como práctica de conversación real con preguntas y respuestas.</li>
      <li>El "Speed Round" sirve para activar memoria rápida después de varias sesiones.</li>
      <li>La app guarda avance localmente en el dispositivo, sin servidor ni cuentas externas.</li>
    </ul>
  </div>
  <div class="parent-card" style="margin-top:14px">
    <h3>🎯 Cómo está estructurada cada lección</h3>
    <ul>
      <li><b>Flashcards</b> — Cada palabra con icono, fonética y frase modelo. Audio en inglés.</li>
      <li><b>Escucha y elige</b> — Identificar significado escuchando inglés.</li>
      <li><b>Tap the thing</b> — Encontrar el objeto correcto en una escena.</li>
      <li><b>Memorice con audio</b> — Unir imagen con palabra escrita; al voltear suena en inglés.</li>
      <li><b>Ordenar frase</b> — Construir frases completas con tarjetas.</li>
      <li><b>Diálogo</b> (en lecciones de saludos, presentación y sala) — Conversaciones reales con respuestas múltiples.</li>
      <li><b>Speed Round</b> (algunas lecciones) — Práctica intensiva contra reloj con vidas.</li>
    </ul>
  </div>
  <div class="parent-card" style="margin-top:14px">
    <h3>🔊 Sobre el audio</h3>
    <ul>
      <li>Las palabras y frases en inglés se pronuncian siempre con voz inglesa, incluso si están dentro de una explicación en español.</li>
      <li>El español se pronuncia con voz en español de Chile cuando está disponible.</li>
      <li>Toca dos veces una palabra en la Biblioteca para escucharla más despacio.</li>
    </ul>
  </div>`;
}

async function speakHelp(){
  if($('loginScreen').classList.contains('hidden')){
    await speakMixed('Usa la barra inferior para ir a [[en]]Path[[/en]] (ruta), [[en]]Practice[[/en]] (práctica), [[en]]Words[[/en]] (palabras) o padres. En cada tarjeta el botón de audio reproduce inglés.');
  }else{
    await speakES('Crea un perfil o toca un perfil existente para empezar.');
  }
}

function confetti(){
  for(let i=0;i<42;i++){
    setTimeout(()=>{
      const c=document.createElement('div');c.className='confetti';
      c.style.left=Math.random()*100+'%';
      c.style.background=['#6D5DF6','#FF66A3','#FFD43B','#12B886','#00C2FF'][i%5];
      c.style.animationDelay=Math.random()*0.25+'s';
      document.body.appendChild(c);
      setTimeout(()=>c.remove(),3000);
    },i*28);
  }
}

window.addEventListener('load',()=>{
  renderAvatars();renderProfiles();
  const id=localStorage.getItem(STORE+'_current');
  if(id){const u=appState().users.find(x=>x.id===id);if(u)login(id)}
});

// Activar audio context en primer toque (iOS requirement)
document.addEventListener('touchstart',()=>{getCtx()},{once:true});
document.addEventListener('click',()=>{getCtx()},{once:true});
</script>
