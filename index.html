  <div class="game-modes">
    <button class="game-mode" onclick="quickGame('flashcards')"><span class="icon">🃏</span><b>Flashcards</b><small>Escuchar y ver</small></button>
    <button class="game-mode" onclick="quickGame('listen')"><span class="icon">🎧</span><b>Escucha</b><small>Elige el significado</small></button>
    <button class="game-mode" onclick="quickGame('tap')"><span class="icon">👆</span><b>Tap the thing</b><small>Toca el correcto</small></button>
    <button class="game-mode" onclick="quickGame('memory')"><span class="icon">🧠</span><b>Memorice</b><small>Pares con audio</small></button>
    <button class="game-mode" onclick="quickGame('speed')"><span class="icon">⚡</span><b>Speed Round</b><small>Contra reloj</small></button>
    <button class="game-mode" onclick="quickGame('dialog')"><span class="icon">💬</span><b>Diálogos</b><small>Conversaciones</small></button>
  </div>
  <div id="quickArea"></div>`;
}
function quickGame(mode){
  const words=shuffled(allWords()).slice(0,8);
  const phrases=LESSONS.flatMap(l=>l.phrases||[]);
  const allDialogs=LESSONS.filter(l=>l.dialog).flatMap(l=>l.dialog);
  currentLesson={id:'_q_'+mode,title:'Práctica rápida',titleEn:'Quick practice',icon:'🎮',scene:'home_morning',words,phrases:shuffled(phrases).slice(0,5),dialog:allDialogs.length?shuffled(allDialogs).slice(0,3):null};
  const area=$('quickArea');
  area.innerHTML='<div id="activityBody"></div>';
  if(mode==='flashcards'){renderQuickFlashcards(words);return}
  if(mode==='listen')renderListenGame();
  if(mode==='tap')renderTapGame();
  if(mode==='memory')renderImageMemory();
  if(mode==='speed')renderSpeedGame();
  if(mode==='dialog'){
    if(!currentLesson.dialog){area.innerHTML='<p style="text-align:center;color:var(--muted);font-weight:900;margin-top:14px">Aún no hay diálogos disponibles.</p>';return}
    renderDialogGame();
  }
  // En modo práctica: el botón "Saltar" se convierte en "Otra ronda"
  setTimeout(()=>{
    const ab=document.querySelector('.action-bar.with-back .primary-btn');
    if(ab){ab.textContent='🎲 Otra ronda';ab.onclick=()=>quickGame(mode)}
  },300);
}
function renderQuickFlashcards(words){
  $('activityBody').innerHTML=`<div class="practice-grid">${words.map(v=>`<article class="practice-card">
    <div>${tw(v.icon,'56px')}</div>
    <h3>${v.en}</h3>
    <p>${v.es} · ${v.lesson}</p>
    <div style="font-family:monospace;color:#5b21b6;background:#f5f3ff;border-radius:10px;padding:6px 10px;display:inline-block;margin:6px 0;font-weight:900">/${v.phonetic}/</div>
    <div class="quick-row">
      <button class="primary-btn" onclick="speakENtwice('${escapeAttr(v.en)}')">🔊 Palabra</button>
      <button class="secondary-btn" onclick="speakEN('${escapeAttr(v.phrase)}')">Frase</button>
    </div>
  </article>`).join('')}</div>
  <div class="action-bar with-back">
    <button class="ghost-btn" onclick="showPractice()">← Cambiar juego</button>
    <button class="primary-btn" onclick="quickGame('flashcards')">🎲 Otra ronda</button>
  </div>`;
}

/* === LIBRARY === */
function showLibrary(){
  setNavTab(2);
  const words=allWords();
  $('content').innerHTML=`<div class="path-header">
    <div><h2>Biblioteca de palabras</h2><p>Toca una palabra para escucharla. Doble toque = lento.</p></div>
    <div class="progress-pill">${words.length} palabras</div>
  </div>
  <div class="library-grid">${words.map(v=>`<button class="word-mini" ondblclick="speakEN('${escapeAttr(v.en)}',.45)" onclick="speakENtwice('${escapeAttr(v.en)}')">
    <div class="e">${tw(v.icon,'48px')}</div>
    <b>${v.en}</b>
    <span>${v.es}</span>
    <small style="display:block;color:#4338ca;font-weight:950;margin-top:6px;font-size:.7rem">/${v.phonetic}/</small>
  </button>`).join('')}</div>`;
}

/* === SETTINGS / PARENTS === */
function showParents(){
  setNavTab(3);
  // Voces disponibles
  refreshVoices();
  const enVoices=cachedVoices.filter(v=>v.lang.toLowerCase().startsWith('en'));
  const optionsHtml=enVoices.length?`<select class="select" id="voiceSel" onchange="changeVoice(this.value)">
    <option value="">Automático (mejor disponible)</option>
    ${enVoices.map(v=>`<option value="${v.voiceURI}" ${prefs.voiceURI===v.voiceURI?'selected':''}>${v.name} (${v.lang})</option>`).join('')}
  </select>`:'<p style="color:var(--muted);font-weight:800">No se detectaron voces inglesas en este dispositivo.</p>';

  $('content').innerHTML=`
  <div class="parent-card">
    <h3>🔊 Audio</h3>
    <label><input type="checkbox" ${prefs.slow?'checked':''} onchange="prefs.slow=this.checked;persistPrefs();toast(prefs.slow?'Audio lento ON':'Audio normal')"> <span>Audio lento (recomendado para empezar)</span></label>
    <div style="margin-top:10px">
      <div style="font-weight:900;margin-bottom:6px">Voz en inglés</div>
      ${optionsHtml}
      <button class="secondary-btn full" style="margin-top:8px" onclick="speakENtwice('Hello! My name is Facu. I am seven years old.')">🔊 Probar voz</button>
    </div>
  </div>
  <div class="parent-card" style="margin-top:14px">
    <h3>👨‍👩‍👦 Para los padres</h3>
    <ul>
      <li>Sesiones de 8 a 12 minutos, 4 veces por semana.</li>
      <li>Lecciones 1-4 (saludos, presentación, sala, palabras mágicas) son la base. Repítelas varias veces.</li>
      <li>Las lecciones de hábitos saludables ayudan a conversaciones reales: agua vs bebida, fruta vs dulce, dormir temprano.</li>
      <li>Celebra la pronunciación aproximada — a esta edad importa más la confianza oral.</li>
      <li>Si tu hijo aún no lee bien, activa "Audio lento" y pídele que repita después de escuchar.</li>
      <li>La app guarda todo localmente en este dispositivo.</li>
    </ul>
  </div>
  <div class="parent-card" style="margin-top:14px">
    <h3>📚 Estructura de cada lección</h3>
    <ul>
      <li><b>Flashcards</b> — Palabra con escena ilustrada, audio doble en inglés, sílabas en colores.</li>
      <li><b>Mini-quiz</b> cada 2 palabras para refuerzo inmediato.</li>
      <li><b>Escucha y elige</b>, <b>Tap the thing</b>, <b>Memorice</b>, <b>Ordenar frase</b>.</li>
      <li><b>Healthy / Unhealthy</b> — Clasificación de comida y hábitos (lección de hábitos).</li>
      <li><b>Diálogo</b> — Conversaciones con respuestas múltiples.</li>
      <li><b>Speed Round</b> — Práctica intensiva contra reloj.</li>
    </ul>
  </div>
  <div class="parent-card" style="margin-top:14px">
    <h3>🎓 Niveles</h3>
    <ul>
      <li><b>Starter 1</b>: Saludos, Mi nombre y edad, Sala de clases, Palabras mágicas, Emociones, Colores, Números, Útiles escolares.</li>
      <li><b>Starter 2</b>: Familia, Cuerpo, Animales, Comida, Rutinas.</li>
      <li><b>Starter 3</b>: Hábitos saludables, Hábitos NO saludables.</li>
    </ul>
  </div>`;
}
function changeVoice(uri){prefs.voiceURI=uri||null;persistPrefs();toast('Voz actualizada');speakENtwice('Hello! How are you today?')}

async function speakHelp(){
  if($('loginScreen').classList.contains('hidden')){
    await speakES('Toca una lección para empezar. Usa el botón tortuga para audio lento.');
  }else{
    await speakES('Crea un perfil o toca un perfil para empezar.');
  }
}

function confetti(){
  for(let i=0;i<42;i++){
    setTimeout(()=>{
      const c=document.createElement('div');c.className='confetti';
      c.style.left=Math.random()*100+'%';
      c.style.background=['#6D5DF6','#FF66A3','#FFD43B','#12B886','#00C2FF'][i%5];
      c.style.animationDelay=Math.random()*0.25+'s';
      document.body.appendChild(c);
      setTimeout(()=>c.remove(),3000);
    },i*28);
  }
}

/* === INIT === */
window.addEventListener('load',()=>{
  renderAvatars();renderProfiles();
  // Pre-warm voices: forzar carga de voces
  if('speechSynthesis'in window){
    speechSynthesis.getVoices();
    setTimeout(refreshVoices,200);
    setTimeout(refreshVoices,800);
  }
  const id=localStorage.getItem(STORE+'_current');
  if(id){const u=appState().users.find(x=>x.id===id);if(u)login(id)}
});
// Activar audio context tras primer gesto (iOS)
document.addEventListener('touchstart',()=>{getCtx();if('speechSynthesis'in window){const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)}},{once:true});
document.addEventListener('click',()=>{getCtx()},{once:true});
</script>
