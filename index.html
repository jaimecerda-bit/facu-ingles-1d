function w(en,es,icon,phonetic,phrase){return{en,es,icon,phonetic,phrase}}
function $(id){return document.getElementById(id)}
function appState(){return JSON.parse(localStorage.getItem(STORE)||'{"users":[]}')}
function saveState(s){localStorage.setItem(STORE,JSON.stringify(s))}
function userData(){return currentUser?.data||{stars:0,badges:0,completed:[],streak:0,lastDay:null,wordsSeen:{}}}
function setCurrentUser(u){currentUser=u;localStorage.setItem(STORE+'_current',u?u.id:'')}
function persistUser(){const s=appState();const idx=s.users.findIndex(u=>u.id===currentUser.id);if(idx>=0){s.users[idx]=currentUser;saveState(s)}}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.remove('show'),2200)}
let cachedVoices=[];
function refreshVoices(){if('speechSynthesis'in window){cachedVoices=window.speechSynthesis.getVoices()||[]}}
if('speechSynthesis'in window){refreshVoices();window.speechSynthesis.onvoiceschanged=refreshVoices}
function preferredVoice(lang){refreshVoices();const prefix=lang.slice(0,2).toLowerCase();const exact=cachedVoices.find(v=>v.lang&&v.lang.toLowerCase()===lang.toLowerCase());if(exact)return exact;const native=cachedVoices.find(v=>v.lang&&v.lang.toLowerCase().startsWith(prefix));return native||null}
function speak(text,lang='en-US',rate=.72){return new Promise(res=>{try{if(!('speechSynthesis'in window)){toast(text);return res()} speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=lang;const v=preferredVoice(lang);if(v)u.voice=v;u.rate=rate;u.pitch=lang.startsWith('en')?1.02:1.08;u.volume=1;u.onend=res;u.onerror=res;speechSynthesis.speak(u)}catch(e){res()}})}
function speakEN(text,rate=.72){return speak(text,'en-US',rate)}
function speakES(text){return speak(text,'es-CL',.86)}
function normalize(str){return String(str).replace(/'/g,'&#39;').replace(/"/g,'&quot;')}
function todayKey(){return new Date().toISOString().slice(0,10)}

function renderAvatars(){ $('avatarGrid').innerHTML=AVATARS.map((a,i)=>`<button class="avatar-choice ${i===0?'selected':''}" onclick="selectAvatar('${a}',this)">${a}</button>`).join('') }
function selectAvatar(a,el){selectedAvatar=a;document.querySelectorAll('.avatar-choice').forEach(x=>x.classList.remove('selected'));el.classList.add('selected')}
function renderProfiles(){const s=appState();$('profiles').innerHTML=s.users.length?s.users.map(u=>`<article class="profile-card"><button class="avatar" onclick="login('${u.id}')">${u.avatar}</button><div class="profile-name">${u.name}</div><div class="profile-meta"><span>⭐ ${u.data.stars||0}</span><span>📚 ${(u.data.completed||[]).length}</span></div><button class="delete-mini" onclick="deleteProfile('${u.id}')">Eliminar</button></article>`).join(''):`<div class="add-card" style="grid-column:1/-1"><div style="font-size:42px">✨</div><b>Aún no hay perfiles</b><p style="color:var(--muted);font-weight:800;margin-top:6px">Crea uno para comenzar.</p></div>`}
function createProfile(){const name=$('nameInput').value.trim();if(!name){speakES('Primero escribe el nombre.');return}const s=appState();if(s.users.some(u=>u.name.toLowerCase()===name.toLowerCase())){speakES('Ese nombre ya existe.');return}const u={id:String(Date.now()),name,avatar:selectedAvatar,data:{stars:0,badges:0,completed:[],streak:0,lastDay:null,wordsSeen:{}}};s.users.push(u);saveState(s);$('nameInput').value='';renderProfiles();login(u.id)}
function deleteProfile(id){const s=appState();const u=s.users.find(x=>x.id===id);if(!u||!confirm('¿Eliminar el perfil de '+u.name+'?'))return;s.users=s.users.filter(x=>x.id!==id);saveState(s);if(currentUser?.id===id)logout();renderProfiles()}
async function login(id){const s=appState();const u=s.users.find(x=>x.id===id);if(!u)return;setCurrentUser(u);$('loginScreen').classList.add('hidden');$('appScreen').classList.remove('hidden');$('profileAvatar').textContent=u.avatar;$('profileName').textContent=u.name;updateStats();showHome();await speakEN('Hello '+u.name+'!');await speakES('Vamos a aprender inglés paso a paso.')}
function logout(){setCurrentUser(null);$('appScreen').classList.add('hidden');$('loginScreen').classList.remove('hidden');renderProfiles();speakES('Elige un perfil para continuar.')}
function updateStats(){const d=userData();$('stars').textContent=d.stars||0;$('done').textContent=(d.completed||[]).length;$('badges').textContent=d.badges||0;$('streak').textContent=d.streak||0}
function setTab(n){document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',i===n));document.querySelectorAll('.bottom-tab').forEach((t,i)=>t.classList.toggle('active',i===n))}
function isUnlocked(i){const d=userData();return i===0||d.completed.includes(LESSONS[i-1].id)}
function showHome(){setTab(0);const d=userData();const pct=Math.round(((d.completed||[]).length/LESSONS.length)*100);$('content').innerHTML=`<div class="path-header"><div><h2>Ruta de aprendizaje</h2><p>De saludos básicos a frases cortas de primer nivel bilingüe.</p></div><div class="progress-pill">${pct}% completado</div></div><div class="lesson-grid">${LESSONS.map((l,i)=>{const done=d.completed.includes(l.id), lock=!isUnlocked(i);return `<article class="lesson ${done?'done':''} ${lock?'locked':''}" onclick="${lock?'speakES(\'Completa la lección anterior primero.\')':'startLesson(\''+l.id+'\')'}"><div class="lesson-top"><div class="lesson-icon">${l.icon}</div><div class="level">${lock?'🔒 Bloqueada':done?'✅ Hecha':l.level}</div></div><h3>${l.title}</h3><p>${l.goal}</p><div class="chips">${l.tags.map(t=>`<span class="chip">${t}</span>`).join('')}</div><div class="status"><span>${l.titleEn}</span><small>${l.words.length} palabras · 4 juegos</small></div></article>`}).join('')}</div>`}
function startLesson(id){currentLesson=LESSONS.find(l=>l.id===id);stepIndex=0;sessionScore=0;showStep();speakES('Lección: '+currentLesson.title);setTimeout(()=>speakEN('Let us learn '+currentLesson.titleEn),600)}
function stepsForLesson(){return currentLesson.words.map((_,i)=>({type:'flash',idx:i})).concat([{type:'listen'},{type:'match'},{type:'sentence'},{type:'complete'}])}
function showStep(){const steps=stepsForLesson();const step=steps[stepIndex];const pct=Math.round((stepIndex/Math.max(1,steps.length-1))*100);$('content').innerHTML=`<div class="activity"><div class="lesson-head"><div class="lesson-head-left"><div class="mini-icon">${currentLesson.icon}</div><div><h2>${currentLesson.title}</h2><p>${currentLesson.titleEn} · Paso ${Math.min(stepIndex+1,steps.length)} de ${steps.length}</p></div></div><button class="secondary-btn" onclick="showHome()">Menú</button></div><div class="stepbar"><div style="width:${pct}%"></div></div><div id="activityBody"></div></div>`; if(step.type==='flash')renderFlash(step.idx); if(step.type==='listen')renderListenGame(); if(step.type==='match')renderMatchGame(); if(step.type==='sentence')renderSentenceGame(); if(step.type==='complete')renderComplete(); updateStats()}
function renderFlash(i){const v=currentLesson.words[i];markSeen(v.en);$('activityBody').innerHTML=`<section class="card flash-main"><div class="audio-badge">🇺🇸 Audio en inglés</div><div class="big-emoji">${v.icon}</div><div class="word">${v.en}</div><div class="phonetic">/${v.phonetic}/</div><div class="translation">${v.es}</div><div class="phrase">Frase modelo: <b>${v.phrase}</b></div><div class="actions"><button class="primary-btn" onclick="playWord(${i})">🔊 Palabra en inglés</button><button class="secondary-btn" onclick="playPhrase(${i})">💬 Frase en inglés</button></div><div class="bottom-nav"><button class="ghost-btn" onclick="prevStep()">← Atrás</button><button class="primary-btn" onclick="nextStep()">Siguiente →</button></div></section>`;setTimeout(()=>playWord(i),250)}
async function playWord(i){const v=currentLesson.words[i];await speakEN(v.en)}
async function playPhrase(i){await speakEN(currentLesson.words[i].phrase)}
function markSeen(word){const d=userData();d.wordsSeen=d.wordsSeen||{};d.wordsSeen[word]=(d.wordsSeen[word]||0)+1;currentUser.data=d;persistUser()}
function nextStep(){stepIndex++;showStep()}
function prevStep(){if(stepIndex>0){stepIndex--;showStep()}else showHome()}
function shuffled(arr){return [...arr].sort(()=>Math.random()-.5)}
function renderListenGame(){const items=shuffled(currentLesson.words).slice(0,4);const correct=items[Math.floor(Math.random()*items.length)];window.listenCorrect=correct.en;window.listenCorrectKey=correct.en;$('activityBody').innerHTML=`<section class="card"><div class="question">🎧 Escucha y elige</div><p class="game-note">El audio será siempre en inglés. Escucha la palabra y toca su significado.</p><button class="primary-btn full" onclick="speakEN(window.listenCorrect)">🇺🇸 Reproducir en inglés</button><div class="options">${items.map(v=>`<button class="option" onclick="answerListen(this,'${normalize(v.en)}')"><span style="font-size:2rem;display:block">${v.icon}</span>${v.es}<small style="display:block;color:#6b7280;margin-top:4px">${v.en}</small></button>`).join('')}</div><div id="feedback" class="feedback"></div><div class="bottom-nav"><button class="ghost-btn" onclick="prevStep()">← Atrás</button><button id="nextGame" class="primary-btn hidden" onclick="nextStep()">Siguiente juego →</button></div></section>`;setTimeout(()=>speakEN(correct.en),350)}
async function answerListen(el,ans){document.querySelectorAll('.option').forEach(o=>o.disabled=true);const ok=ans===window.listenCorrectKey;el.classList.add(ok?'correct':'wrong');if(!ok){[...document.querySelectorAll('.option')].find(o=>o.textContent.includes(currentLesson.words.find(w=>w.en===window.listenCorrect).es))?.classList.add('correct')}showFeedback(ok);if(ok)reward(12);$('nextGame').classList.remove('hidden');if(ok){await speakEN('Correct! '+window.listenCorrect)}else{await speakES('Casi. Mira la respuesta en verde.');await speakEN(window.listenCorrect)}}
function renderMatchGame(){const pairs=shuffled(currentLesson.words).slice(0,4);const cards=shuffled(pairs.flatMap(v=>[{id:v.en,show:v.icon},{id:v.en,show:v.en}]));memoryState={open:[],matched:0,total:cards.length};$('activityBody').innerHTML=`<section class="card"><div class="question">🧠 Memoria</div><p class="game-note">Une imagen con palabra en inglés.</p><div class="memory-grid">${cards.map((c,i)=>`<button class="mem" data-id="${normalize(c.id)}" data-show="${normalize(c.show)}" onclick="flipMem(this)">?</button>`).join('')}</div><div id="feedback" class="feedback"></div><div class="bottom-nav"><button class="ghost-btn" onclick="prevStep()">← Atrás</button><button id="nextGame" class="primary-btn hidden" onclick="nextStep()">Siguiente juego →</button></div></section>`;speakES('Encuentra las parejas.')}
function flipMem(el){if(el.classList.contains('matched')||el.classList.contains('flipped')||memoryState.open.length>=2)return;el.textContent=el.dataset.show;el.classList.add('flipped');if(/[A-Za-z]/.test(el.dataset.show))speakEN(el.dataset.show);memoryState.open.push(el);if(memoryState.open.length===2)setTimeout(checkMem,650)}
async function checkMem(){const[a,b]=memoryState.open;if(a.dataset.id===b.dataset.id){a.classList.add('matched');b.classList.add('matched');memoryState.matched+=2;reward(5);await speakEN('Great match!');if(memoryState.matched===memoryState.total){showFeedback(true,'¡Todas las parejas!');$('nextGame').classList.remove('hidden');confetti()}}else{a.classList.remove('flipped');b.classList.remove('flipped');a.textContent='?';b.textContent='?'}memoryState.open=[]}
function renderSentenceGame(){const phrase=currentLesson.phrases[Math.floor(Math.random()*currentLesson.phrases.length)];sentenceState={target:phrase,chosen:[]};const tiles=shuffled(phrase.split(' '));$('activityBody').innerHTML=`<section class="card"><div class="question">🧩 Ordena la frase</div><p class="game-note">Construye: <b>${phrase}</b></p><div id="drop" class="dropzone">Toca las palabras abajo</div><div id="tiles" class="sentence-row">${tiles.map(t=>`<button class="tile" onclick="pickTile(this,'${normalize(t)}')">${t}</button>`).join('')}</div><button class="secondary-btn full" onclick="speakEN('${normalize(phrase)}')">🔊 Escuchar frase</button><div id="feedback" class="feedback"></div><div class="bottom-nav"><button class="ghost-btn" onclick="prevStep()">← Atrás</button><button id="nextGame" class="primary-btn hidden" onclick="nextStep()">Completar →</button></div></section>`;speakEN(phrase)}
function pickTile(el,t){sentenceState.chosen.push(t);el.disabled=true;el.style.opacity=.35;$('drop').innerHTML=sentenceState.chosen.map(x=>`<span class="tile">${x}</span>`).join('');const built=sentenceState.chosen.join(' ');if(sentenceState.chosen.length===sentenceState.target.split(' ').length){const ok=built===sentenceState.target;showFeedback(ok,ok?'¡Frase correcta!':'Revisa el orden de la frase.');if(ok){reward(15);$('nextGame').classList.remove('hidden');speakEN(sentenceState.target)}else setTimeout(()=>renderSentenceGame(),1200)}}
function renderComplete(){const d=userData();if(!d.completed.includes(currentLesson.id)){d.completed.push(currentLesson.id);d.badges=(d.badges||0)+1;d.stars=(d.stars||0)+40;const today=todayKey();if(d.lastDay!==today){d.streak=(d.streak||0)+1;d.lastDay=today}currentUser.data=d;persistUser()}updateStats();$('activityBody').innerHTML=`<section class="card flash-main"><div class="big-emoji">🏆</div><div class="word" style="font-size:clamp(2rem,8vw,3.2rem)">¡Lección completada!</div><div class="translation">${currentLesson.title}</div><p class="phrase">Ganaste estrellas, una medalla y desbloqueaste la siguiente lección.</p><div class="actions"><button class="secondary-btn" onclick="startLesson('${currentLesson.id}')">🔁 Repetir</button><button class="primary-btn" onclick="showHome()">Ruta →</button></div></section>`;confetti();speakES('Felicitaciones. Completaste la lección.');setTimeout(()=>speakEN('Congratulations!'),700)}
function reward(points){const d=userData();d.stars=(d.stars||0)+points;currentUser.data=d;persistUser();updateStats()}
function showFeedback(ok,msg){const f=$('feedback');f.className='feedback show '+(ok?'good':'bad');f.textContent=msg||(ok?'✅ Correcto':'❌ Intenta otra vez')}
function allWords(){return LESSONS.flatMap(l=>l.words.map(w=>({...w,lesson:l.title,lessonEn:l.titleEn})))}
function showPractice(){setTab(1);const words=shuffled(allWords()).slice(0,8);$('content').innerHTML=`<div class="path-header"><div><h2>Práctica rápida</h2><p>Repaso libre con audio 100% en inglés para palabras y frases.</p></div><div class="progress-pill">Modo juego</div></div><div class="practice-grid">${words.map((v,i)=>`<article class="practice-card"><div style="font-size:2.8rem">${v.icon}</div><h3>${v.en}</h3><p>${v.es} · ${v.lesson}</p><div class="quick-row"><button class="primary-btn" onclick="speakEN('${normalize(v.en)}')">🔊 Palabra</button><button class="secondary-btn" onclick="speakEN('${normalize(v.phrase)}')">Frase</button></div></article>`).join('')}</div><div class="bottom-nav"><button class="ghost-btn" onclick="showHome()">← Ruta</button><button class="primary-btn" onclick="showPractice()">Otra ronda 🎲</button></div>`}
function showLibrary(){setTab(2);const words=allWords();$('content').innerHTML=`<div class="path-header"><div><h2>Biblioteca de palabras</h2><p>Toca una palabra o frase para escucharla en inglés.</p></div><div class="progress-pill">${words.length} palabras</div></div><div class="library-grid">${words.map(v=>`<button class="word-mini" onclick="speakEN('${normalize(v.en)}')"><div class="e">${v.icon}</div><b>${v.en}</b><span>${v.es}</span><small style="display:block;color:#4338ca;font-weight:950;margin-top:6px">🇺🇸 English audio</small></button>`).join('')}</div>`}
function showParents(){setTab(3);$('content').innerHTML=`<div class="parent-card"><h3>Guía para acompañar el aprendizaje</h3><ul><li>Usar 8 a 12 minutos por sesión, idealmente 4 veces por semana.</li><li>Repetir primero las lecciones de saludos, presentación y sala de clases: son la base de colegio bilingüe.</li><li>Pedirle al niño que diga una frase completa, no solo palabras sueltas: “My name is…”, “I am happy”, “Thank you”.</li><li>Celebrar la pronunciación aproximada; a esta edad importa más la confianza oral que la perfección.</li><li>La app guarda avance localmente en el dispositivo, sin servidor ni cuentas externas.</li></ul></div>`}
async function speakHelp(){if($('loginScreen').classList.contains('hidden')){await speakES('Usa la barra inferior para ir a ruta, práctica, palabras o padres. En cada tarjeta, el botón de audio reproduce inglés.');}else{await speakES('Crea un perfil o toca un perfil existente para empezar.')}}
function confetti(){for(let i=0;i<42;i++){setTimeout(()=>{const c=document.createElement('div');c.className='confetti';c.style.left=Math.random()*100+'%';c.style.background=['#6D5DF6','#FF66A3','#FFD43B','#12B886','#00C2FF'][i%5];c.style.animationDelay=Math.random()*0.25+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),3000)},i*28)}}
window.addEventListener('load',()=>{renderAvatars();renderProfiles();const id=localStorage.getItem(STORE+'_current');if(id){const u=appState().users.find(x=>x.id===id);if(u)login(id)}});
</script>
