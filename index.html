<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="FACU INGLÉS 1D - Plataforma profesional de aprendizaje de inglés para niños">
    <meta name="theme-color" content="#6366f1">
    <title>FACU INGLÉS 1D - Professional Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #6366f1;
            --secondary: #ec4899;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --dark: #1f2937;
            --light: #f3f4f6;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }
        .animated-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }
        .floating-shape {
            position: absolute;
            opacity: 0.1;
            animation: float 20s infinite ease-in-out;
        }
        @keyframes float {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(100px, -100px) rotate(90deg); }
            50% { transform: translate(200px, 50px) rotate(180deg); }
            75% { transform: translate(-50px, 100px) rotate(270deg); }
        }
        .shape-1 { top: 10%; left: 10%; font-size: 100px; animation-delay: 0s; }
        .shape-2 { top: 60%; left: 70%; font-size: 80px; animation-delay: 2s; }
        .shape-3 { top: 30%; left: 80%; font-size: 120px; animation-delay: 4s; }
        .shape-4 { top: 70%; left: 20%; font-size: 90px; animation-delay: 6s; }
        .audio-helper {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 90px;
            height: 90px;
            background: linear-gradient(135deg, var(--secondary), var(--danger));
            border-radius: 50%;
            border: 5px solid white;
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
            cursor: pointer;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5em;
            animation: pulse 2s infinite;
            transition: all 0.3s;
        }
        .audio-helper:hover {
            transform: scale(1.2);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        .audio-helper.speaking { animation: wave 0.5s infinite; }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        @keyframes wave {
            0%, 100% { transform: scale(1) rotate(0deg); }
            25% { transform: scale(1.15) rotate(-10deg); }
            75% { transform: scale(1.15) rotate(10deg); }
        }
        .voice-indicator {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255,255,255,0.95);
            padding: 15px 30px;
            border-radius: 50px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            display: none;
            align-items: center;
            gap: 15px;
            z-index: 1001;
            font-size: 1.2em;
            font-weight: 600;
        }
        .voice-indicator.active {
            display: flex;
            animation: slideDown 0.3s;
        }
        @keyframes slideDown {
            from { transform: translateX(-50%) translateY(-100px); opacity: 0; }
            to { transform: translateX(-50%) translateY(0); opacity: 1; }
        }
        .voice-wave { display: flex; gap: 4px; align-items: center; }
        .voice-bar {
            width: 4px;
            height: 20px;
            background: var(--primary);
            border-radius: 2px;
            animation: wave-bar 0.5s infinite alternate;
        }
        .voice-bar:nth-child(2) { animation-delay: 0.1s; }
        .voice-bar:nth-child(3) { animation-delay: 0.2s; }
        .voice-bar:nth-child(4) { animation-delay: 0.3s; }
        @keyframes wave-bar {
            from { height: 10px; }
            to { height: 30px; }
        }
        .login-screen {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .login-container {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-radius: 40px;
            padding: 50px;
            max-width: 900px;
            width: 100%;
            box-shadow: 0 30px 80px rgba(0,0,0,0.3);
            animation: fadeIn 0.5s;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        .logo { text-align: center; margin-bottom: 40px; }
        .logo-icon {
            font-size: 8em;
            display: inline-block;
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        .logo h1 {
            font-family: 'Fredoka One', cursive;
            font-size: 3.5em;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 20px 0;
        }
        .subtitle {
            text-align: center;
            color: var(--dark);
            font-size: 1.4em;
            margin-bottom: 40px;
            font-weight: 600;
        }
        .users-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }
        .user-card {
            background: linear-gradient(135deg, #fff, #f0f0ff);
            padding: 30px;
            border-radius: 25px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            border: 4px solid transparent;
            position: relative;
            overflow: hidden;
        }
        .user-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 0;
        }
        .user-card:hover::before { opacity: 0.1; }
        .user-card:hover {
            transform: translateY(-10px) scale(1.05);
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            border-color: var(--primary);
        }
        .user-card > * { position: relative; z-index: 1; }
        .user-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4em;
            margin: 0 auto 20px;
            border: 5px solid white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            animation: bounce 3s infinite;
        }
        .user-name {
            font-size: 1.4em;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 10px;
        }
        .user-stats {
            background: white;
            padding: 10px;
            border-radius: 15px;
            font-size: 1.1em;
            display: flex;
            justify-content: space-around;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .delete-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 40px;
            height: 40px;
            background: var(--danger);
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.5em;
            font-weight: bold;
            display: none;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transition: all 0.3s;
            z-index: 2;
        }
        .user-card:hover .delete-btn { display: block; }
        .delete-btn:hover { transform: scale(1.2) rotate(90deg); }
        .new-user-form {
            background: linear-gradient(135deg, #e0f2fe, #ddd6fe);
            padding: 40px;
            border-radius: 30px;
            border: 5px dashed var(--primary);
        }
        .form-title {
            text-align: center;
            font-size: 2em;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 30px;
        }
        .input-group { margin-bottom: 30px; }
        .input-label {
            font-size: 1.3em;
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 15px;
            display: block;
            text-align: center;
        }
        #userName {
            width: 100%;
            padding: 20px;
            font-size: 1.5em;
            border: 4px solid var(--primary);
            border-radius: 20px;
            text-align: center;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s;
        }
        #userName:focus {
            outline: none;
            border-color: var(--secondary);
            box-shadow: 0 0 30px rgba(236, 72, 153, 0.3);
            transform: scale(1.02);
        }
        .avatar-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 15px;
            margin-top: 20px;
        }
        .avatar-option {
            aspect-ratio: 1;
            background: white;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3em;
            cursor: pointer;
            border: 4px solid transparent;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }
        .avatar-option::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            opacity: 0;
            transition: opacity 0.3s;
        }
        .avatar-option:hover::before { opacity: 0.2; }
        .avatar-option:hover {
            transform: scale(1.15) rotate(5deg);
            border-color: var(--primary);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .avatar-option.selected {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-color: var(--secondary);
            transform: scale(1.2);
            animation: pulse 1s infinite;
        }
        .avatar-option > span { position: relative; z-index: 1; }
        .avatar-option.selected > span {
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.3));
        }
        .create-btn {
            width: 100%;
            padding: 25px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 2em;
            font-weight: 700;
            cursor: pointer;
            margin-top: 30px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
            transition: all 0.3s;
            font-family: 'Fredoka One', cursive;
        }
        .create-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
        }
        .create-btn:active { transform: scale(0.95); }
        .app-screen {
            display: none;
            position: relative;
            z-index: 1;
            min-height: 100vh;
            padding: 20px;
        }
        .app-container {
            max-width: 1400px;
            margin: 0 auto;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-radius: 40px;
            overflow: hidden;
            box-shadow: 0 30px 80px rgba(0,0,0,0.3);
        }
        .app-header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 40px;
            position: relative;
            overflow: hidden;
        }
        .app-header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -10%;
            width: 500px;
            height: 500px;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
        }
        .user-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
            position: relative;
            z-index: 1;
            flex-wrap: wrap;
            gap: 20px;
        }
        .user-profile {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .profile-avatar {
            width: 80px;
            height: 80px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3em;
            border: 5px solid rgba(255,255,255,0.5);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            animation: bounce 3s infinite;
        }
        .profile-info h2 {
            font-size: 2em;
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        .logout-btn {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 3px solid white;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 1.3em;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
        }
        .logout-btn:hover {
            background: white;
            color: var(--primary);
            transform: scale(1.1);
        }
        .app-title {
            text-align: center;
            font-family: 'Fredoka One', cursive;
            font-size: 3em;
            margin: 20px 0;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.2);
            position: relative;
            z-index: 1;
        }
        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
            position: relative;
            z-index: 1;
        }
        .stat-card {
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            border: 2px solid rgba(255,255,255,0.3);
        }
        .stat-value {
            font-size: 3em;
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        .stat-label {
            font-size: 1.2em;
            margin-top: 10px;
            font-weight: 600;
        }
        .app-content { padding: 50px; }
        .lessons-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 35px;
        }
        .lesson-card {
            background: linear-gradient(135deg, #fff, #f8f9ff);
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            border: 5px solid transparent;
            position: relative;
            overflow: hidden;
        }
        .lesson-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            opacity: 0;
            transition: opacity 0.3s;
        }
        .lesson-card:hover::before { opacity: 0.1; }
        .lesson-card:hover {
            transform: translateY(-15px);
            box-shadow: 0 25px 60px rgba(0,0,0,0.3);
            border-color: var(--primary);
        }
        .lesson-card.completed {
            background: linear-gradient(135deg, #d1fae5, #a7f3d0);
            border-color: var(--success);
        }
        .lesson-card.locked {
            opacity: 0.5;
            cursor: not-allowed;
            filter: grayscale(100%);
        }
        .lesson-card > * { position: relative; z-index: 1; }
        .lesson-icon {
            font-size: 6em;
            margin-bottom: 25px;
            display: inline-block;
            animation: bounce 3s infinite;
        }
        .lesson-title {
            font-size: 2em;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 15px;
        }
        .lesson-subtitle {
            font-size: 1.3em;
            color: #6b7280;
            margin-bottom: 20px;
        }
        .lesson-progress {
            background: white;
            padding: 12px;
            border-radius: 15px;
            font-size: 1.1em;
            font-weight: 600;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .badge {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 3.5em;
            animation: pulse 2s infinite;
        }
        .vocab-display {
            max-width: 900px;
            margin: 0 auto;
        }
        .vocab-card {
            background: linear-gradient(135deg, #fef3c7, #fde68a);
            padding: 60px;
            border-radius: 40px;
            text-align: center;
            border: 8px solid var(--warning);
            margin-bottom: 40px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        }
        .vocab-card:hover {
            transform: scale(1.03);
            box-shadow: 0 30px 80px rgba(0,0,0,0.3);
        }
        .vocab-illustration {
            font-size: 10em;
            margin-bottom: 30px;
            display: inline-block;
            animation: bounce 2s infinite;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.2));
        }
        .vocab-word {
            font-size: 4em;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }
        .vocab-phonetic {
            font-size: 2em;
            color: #6b7280;
            font-style: italic;
            background: white;
            padding: 15px 30px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .vocab-translation {
            font-size: 2.5em;
            color: var(--dark);
            font-weight: 600;
            margin-bottom: 30px;
        }
        .speak-button {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 25px 60px;
            border-radius: 30px;
            font-size: 2em;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
            transition: all 0.3s;
            font-family: 'Fredoka One', cursive;
        }
        .speak-button:hover {
            transform: scale(1.1);
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
        }
        .quiz-question {
            text-align: center;
            font-size: 2.5em;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 30px;
        }
        .quiz-icon {
            font-size: 8em;
            margin: 30px 0;
            display: inline-block;
            animation: bounce 2s infinite;
        }
        .quiz-hint {
            text-align: center;
            font-size: 1.5em;
            color: #6b7280;
            margin-bottom: 40px;
        }
        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
            max-width: 900px;
            margin: 0 auto;
        }
        .option-card {
            background: white;
            padding: 40px;
            border-radius: 25px;
            border: 5px solid #e5e7eb;
            font-size: 1.8em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .option-card:hover {
            border-color: var(--primary);
            transform: translateY(-10px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
        }
        .option-card.correct {
            background: linear-gradient(135deg, #d1fae5, #a7f3d0);
            border-color: var(--success);
            animation: correctPulse 0.5s 3;
        }
        .option-card.incorrect {
            background: linear-gradient(135deg, #fee2e2, #fecaca);
            border-color: var(--danger);
            animation: shake 0.5s;
        }
        @keyframes correctPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-15px); }
            75% { transform: translateX(15px); }
        }
        .memory-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            max-width: 700px;
            margin: 40px auto;
        }
        .memory-card {
            aspect-ratio: 1;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3em;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            position: relative;
        }
        .memory-card:hover { transform: scale(1.05); }
        .memory-card.flipped {
            background: white;
            color: var(--dark);
            border: 5px solid var(--primary);
        }
        .memory-card.matched {
            background: linear-gradient(135deg, #d1fae5, #a7f3d0);
            color: var(--success);
            cursor: default;
        }
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 50px;
            gap: 20px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 20px 50px;
            border: none;
            border-radius: 25px;
            font-size: 1.6em;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            font-family: 'Poppins', sans-serif;
        }
        .btn-back {
            background: linear-gradient(135deg, #f3f4f6, #e5e7eb);
            color: var(--dark);
        }
        .btn-next {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
        }
        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .feedback-banner {
            text-align: center;
            padding: 35px;
            border-radius: 25px;
            font-size: 2.5em;
            font-weight: 700;
            margin: 40px 0;
            display: none;
            animation: slideDown 0.5s;
        }
        .feedback-banner.show { display: block; }
        .feedback-banner.success {
            background: linear-gradient(135deg, #d1fae5, #a7f3d0);
            color: var(--success);
            border: 5px solid var(--success);
        }
        .feedback-banner.error {

        function speak(text, lang = 'en-US', rate = 0.6) {
            return new Promise((resolve) => {
                if (!('speechSynthesis' in window)) {
                    resolve();
                    return;
                }
                speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = lang;
                utterance.rate = rate;
                utterance.pitch = 1.1;
                utterance.volume = 1;
                isSpeaking = true;
                document.querySelector('.audio-helper').classList.add('speaking');
                showVoiceIndicator(text);
                utterance.onend = () => {
                    isSpeaking = false;
                    document.querySelector('.audio-helper').classList.remove('speaking');
                    hideVoiceIndicator();
                    resolve();
                };
                utterance.onerror = () => {
                    isSpeaking = false;
                    document.querySelector('.audio-helper').classList.remove('speaking');
                    hideVoiceIndicator();
                    resolve();
                };
                speechSynthesis.speak(utterance);
            });
        }

        function speakES(text) {
            return speak(text, 'es-ES', 0.8);
        }

        function showVoiceIndicator(text) {
            const indicator = document.getElementById('voiceIndicator');
            const voiceText = document.getElementById('voiceText');
            voiceText.textContent = text.substring(0, 30) + (text.length > 30 ? '...' : '');
            indicator.classList.add('active');
        }

        function hideVoiceIndicator() {
            document.getElementById('voiceIndicator').classList.remove('active');
        }

        async function helpMe() {
            const isLogin = document.getElementById('loginScreen').style.display !== 'none';
            if (isLogin) {
                await speakES('Toca un usuario para empezar, o crea uno nuevo escribiendo tu nombre y eligiendo tu avatar favorito');
            } else {
                await speakES('Toca una lección para aprender palabras nuevas en inglés');
            }
        }

        function getUsers() {
            return JSON.parse(localStorage.getItem('facuUsers') || '[]');
        }

        function saveUsers(users) {
            localStorage.setItem('facuUsers', JSON.stringify(users));
        }

        function getUserData(userId) {
            return JSON.parse(localStorage.getItem('facuData_' + userId) || '{"stars":0,"badges":0,"completed":[],"streak":0}');
        }

        function saveUserData(userId, data) {
            localStorage.setItem('facuData_' + userId, JSON.stringify(data));
        }

        function renderAvatars() {
            const grid = document.getElementById('avatarGrid');
            grid.innerHTML = AVATARS.map((av, i) => 
                `<div class="avatar-option ${i === 0 ? 'selected' : ''}" data-avatar="${av}" onclick="selectAvatar('${av}', this)">
                    <span>${av}</span>
                </div>`
            ).join('');
        }

        function selectAvatar(avatar, elem) {
            document.querySelectorAll('.avatar-option').forEach(el => el.classList.remove('selected'));
            elem.classList.add('selected');
            selectedAvatar = avatar;
            speak(avatar);
        }

        async function createUser() {
            const name = document.getElementById('userName').value.trim();
            if (!name) {
                await speakES('Por favor escribe tu nombre');
                return;
            }
            const users = getUsers();
            if (users.find(u => u.name.toLowerCase() === name.toLowerCase())) {
                await speakES('Este nombre ya existe. Elige otro nombre');
                return;
            }
            const newUser = {
                id: Date.now().toString(),
                name: name,
                avatar: selectedAvatar,
                created: new Date().toISOString()
            };
            users.push(newUser);
            saveUsers(users);
            saveUserData(newUser.id, { stars: 0, badges: 0, completed: [], streak: 0 });
            document.getElementById('userName').value = '';
            renderUsers();
            await speakES('Usuario ' + name + ' creado correctamente');
            createConfetti();
        }

        function renderUsers() {
            const users = getUsers();
            const grid = document.getElementById('usersGrid');
            if (users.length === 0) {
                grid.innerHTML = '<p style="text-align:center;color:#999;padding:30px;font-size:1.3em;grid-column:1/-1">No hay usuarios todavía</p>';
                return;
            }
            grid.innerHTML = users.map(u => {
                const data = getUserData(u.id);
                return `
                    <div class="user-card" onclick="selectUser('${u.id}')" onmouseenter="speakES('${u.name}')">
                        <button class="delete-btn" onclick="deleteUser('${u.id}', event)">×</button>
                        <div class="user-avatar">${u.avatar}</div>
                        <div class="user-name">${u.name}</div>
                        <div class="user-stats">
                            <span>⭐ ${data.stars}</span>
                            <span>📚 ${data.completed.length}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function selectUser(userId) {
            const users = getUsers();
            currentUser = users.find(u => u.id === userId);
            localStorage.setItem('currentUser', JSON.stringify(currentUser));
            await speakES('Hola ' + currentUser.name + '. Bienvenido a Facu Inglés');
            showApp();
        }

        async function deleteUser(userId, e) {
            e.stopPropagation();
            const users = getUsers();
            const user = users.find(u => u.id === userId);
            if (!confirm('¿Eliminar usuario "' + user.name + '"?')) return;
            saveUsers(users.filter(u => u.id !== userId));
            localStorage.removeItem('facuData_' + userId);
            renderUsers();
            await speakES('Usuario eliminado');
        }

                const completed = data.completed.includes(lesson.id);

                html += `
                    <div class="lesson-card ${completed ? 'completed' : ''} ${locked ? 'locked' : ''}"
                         ${locked ? '' : `onclick="startLesson('${lesson.id}')"`}
                         ${locked ? '' : `onmouseenter="speakES('${lesson.title}')"`}>
                        ${completed ? '<div class="badge">✅</div>' : ''}
                        ${locked ? '<div class="badge">🔒</div>' : ''}
                        <div class="lesson-icon">${lesson.icon}</div>
                        <div class="lesson-title">${lesson.title}</div>
                        <div class="lesson-subtitle">${lesson.titleEn}</div>
                        <div class="lesson-progress">${completed ? 'Completada' : locked ? 'Bloqueada' : 'Empezar'}</div>
                    </div>
                `;
            });
            html += '</div>';
            content.innerHTML = html;
            setTimeout(() => speakES('Elige una lección tocando en ella'), 500);
        }

        async function startLesson(id) {
            currentLesson = LESSONS[id];
            currentActivity = 0;
            score = 0;
            await speakES('Vamos a aprender ' + currentLesson.title);
            await new Promise(r => setTimeout(r, 500));
            await speak('Lets learn ' + currentLesson.titleEn);
            showActivity();
        }

        function showActivity() {
            const totalVocab = currentLesson.vocab.length;
            const totalQuiz = currentLesson.quiz.length;
            const hasMemory = currentLesson.memory ? 1 : 0;
            const totalActivities = totalVocab + totalQuiz + hasMemory;
            if (currentActivity < totalVocab) {
                showVocab();
            } else if (currentActivity < totalVocab + totalQuiz) {
                showQuiz();
            } else if (currentActivity < totalActivities) {
                showMemoryGame();
            } else {
                completeLesson();
            }
        }

        async function showVocab() {
            const v = currentLesson.vocab[currentActivity];
            const content = document.getElementById('appContent');
            content.innerHTML = `
                <div class="vocab-display">
                    <h2 style="text-align:center;font-size:2em;margin-bottom:30px;color:#6366f1">
                        Palabra ${currentActivity + 1} de ${currentLesson.vocab.length}
                    </h2>
                    <div class="vocab-card" onclick="speakWord('${v.en}', '${v.es}')">
                        <div class="vocab-illustration">${v.icon}</div>
                        <div class="vocab-word">${v.en}</div>
                        <div class="vocab-phonetic">${v.phonetic}</div>
                        <div class="vocab-translation">${v.es}</div>
                        <button class="speak-button" onclick="speakWord('${v.en}', '${v.es}'); event.stopPropagation()">
                            🔊 ESCUCHAR
                        </button>
                    </div>
                    <div class="nav-buttons">
                        <button class="btn btn-back" onclick="showMenu()">← MENÚ</button>
                        <button class="btn btn-next" onclick="nextActivity()">SIGUIENTE →</button>
                    </div>
                </div>
            `;
            setTimeout(() => speakWord(v.en, v.es), 300);
        }

        async function speakWord(en, es) {
            await speak(en, 'en-US', 0.6);
            await new Promise(r => setTimeout(r, 800));
            await speakES('En español significa');
            await new Promise(r => setTimeout(r, 500));
            await speakES(es);
        }

        async function showQuiz() {
            const idx = currentActivity - currentLesson.vocab.length;
            const q = currentLesson.quiz[idx];
            const content = document.getElementById('appContent');
            content.innerHTML = `
                <div class="quiz-question">${q.q}</div>
                <div class="quiz-icon">${q.icon}</div>
                <div class="quiz-hint">👆 Toca la respuesta correcta</div>
                <div class="options-grid">
                    ${q.opts.map((opt, i) => `
                        <div class="option-card" onclick="checkAnswer(${i}, ${q.correct}, this, '${q.optsEn[i]}')"
                             onmouseenter="speak('${q.optsEn[i]}', 'en-US', 0.7)">
                            ${opt}
                        </div>
                    `).join('')}
                </div>
                <div class="feedback-banner" id="feedback"></div>
                <div class="nav-buttons">
                    <button class="btn btn-back" onclick="showMenu()">← MENÚ</button>
                    <button class="btn btn-next" id="nextBtn" style="display:none" onclick="nextActivity()">SIGUIENTE →</button>
                </div>
            `;
            setTimeout(async () => {
                await speakES(q.q);
            }, 300);
        }

        async function checkAnswer(selected, correct, elem, wordEn) {
            const cards = document.querySelectorAll('.option-card');
            cards.forEach(c => c.style.pointerEvents = 'none');
            const fb = document.getElementById('feedback');
            if (selected === correct) {
                elem.classList.add('correct');
                fb.className = 'feedback-banner success show';
                fb.textContent = '✅ ¡CORRECTO! ¡MUY BIEN!';
                score++;
                const data = getUserData(currentUser.id);
                data.stars += 10;
                saveUserData(currentUser.id, data);
                updateStats();
                await speakES('¡Muy bien! ¡Correcto!');
                await new Promise(r => setTimeout(r, 500));
                await speak('Excellent! ' + wordEn + ' is correct!', 'en-US', 0.7);
                createConfetti();
            } else {
                elem.classList.add('incorrect');
                cards[correct].classList.add('correct');
                fb.className = 'feedback-banner error show';
                fb.textContent = '❌ Intenta de nuevo';
                await speakES('Intenta de nuevo. La respuesta correcta está en verde');
            }
            document.getElementById('nextBtn').style.display = 'block';
        }

        function showMemoryGame() {
            const content = document.getElementById('appContent');
            const pairs = currentLesson.memory;
            const cards = [];
            pairs.forEach(p => {
                cards.push({ type: 'text', content: p.text, id: p.text });
                cards.push({ type: 'icon', content: p.icon, id: p.text });
            });
            for (let i = cards.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [cards[i], cards[j]] = [cards[j], cards[i]];
            }
            content.innerHTML = `
                <h2 style="text-align:center;font-size:2.5em;margin-bottom:30px;color:#6366f1">
                    🧠 Juego de Memoria
                </h2>
                <p style="text-align:center;font-size:1.5em;margin-bottom:30px;color:#6b7280">
                    Encuentra las parejas
                </p>
                <div class="memory-grid">
                    ${cards.map((c, i) => `
                        <div class="memory-card" data-id="${c.id}" data-index="${i}" onclick="flipCard(this)">
                            <span class="front" style="display:none">${c.content}</span>
                            <span class="back">?</span>
                        </div>
                    `).join('')}
                </div>
                <div class="feedback-banner" id="feedback"></div>
                <div class="nav-buttons">
                    <button class="btn btn-back" onclick="showMenu()">← MENÚ</button>
                    <button class="btn btn-next" id="nextBtn" style="display:none" onclick="nextActivity()">SIGUIENTE →</button>
                </div>
            `;
            window.memoryFlipped = [];
            window.memoryMatched = 0;
            setTimeout(() => speakES('Encuentra las parejas tocando las tarjetas'), 500);
        }

        async function flipCard(card) {
            if (card.classList.contains('matched') || window.memoryFlipped.length >= 2) return;
            card.classList.add('flipped');
            card.querySelector('.back').style.display = 'none';
            card.querySelector('.front').style.display = 'block';
            window.memoryFlipped.push(card);
            if (window.memoryFlipped.length === 2) {
                setTimeout(() => checkMemoryMatch(), 1000);
            }
        }

        async function checkMemoryMatch() {
            const [c1, c2] = window.memoryFlipped;
            const id1 = c1.getAttribute('data-id');
            const id2 = c2.getAttribute('data-id');
            if (id1 === id2) {
                c1.classList.add('matched');
                c2.classList.add('matched');
                window.memoryMatched += 2;
                await speak('Great match!', 'en-US', 0.8);
                const data = getUserData(currentUser.id);
                data.stars += 5;
                saveUserData(currentUser.id, data);
                updateStats();
                if (window.memoryMatched === document.querySelectorAll('.memory-card').length) {
                    setTimeout(() => {
                        const fb = document.getElementById('feedback');
                        fb.className = 'feedback-banner success show';
                        fb.textContent = '🎉 ¡Increíble! ¡Todas las parejas!';
                        document.getElementById('nextBtn').style.display = 'block';
                        score++;
                        createConfetti();
                        speakES('¡Increíble! Encontraste todas las parejas');
                    }, 500);
                }
            } else {
                c1.classList.remove('flipped');
                c2.classList.remove('flipped');
                c1.querySelector('.back').style.display = 'block';
                c1.querySelector('.front').style.display = 'none';
                c2.querySelector('.back').style.display = 'block';
                c2.querySelector('.front').style.display = 'none';
            }
            window.memoryFlipped = [];
        }

        function nextActivity() {
            currentActivity++;
            showActivity();
        }

        async function completeLesson() {
            const data = getUserData(currentUser.id);
            if (!data.completed.includes(currentLesson.id)) {
                data.completed.push(currentLesson.id);
                data.stars += 50;
                data.badges += 1;
                data.streak += 1;
                saveUserData(currentUser.id, data);
            }
            const content = document.getElementById('appContent');
            content.innerHTML = `
                <div class="completion">
                    <div class="completion-icon">${currentLesson.icon}</div>
                    <h2 class="completion-title">¡LECCIÓN COMPLETADA!</h2>
                    <div class="stars-display">⭐⭐⭐</div>
                    <div class="completion-score">
                        ¡Ganaste ${score} puntos!
                    </div>
                    <button class="btn btn-next" onclick="showMenu()" style="margin: 40px auto; float: none; display: block;">
                        VOLVER AL MENÚ
                    </button>
                </div>
            `;
            updateStats();
            createConfetti();
            setTimeout(async () => {
                await speakES('¡Felicitaciones! Completaste la lección de ' + currentLesson.title);
                await new Promise(r => setTimeout(r, 500));
                await speak('Congratulations! You completed ' + currentLesson.titleEn, 'en-US', 0.7);
            }, 500);
        }

        function createConfetti() {
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    const piece = document.createElement('div');
                    piece.className = 'confetti-piece';
                    piece.style.left = Math.random() * 100 + '%';
                    piece.style.top = '-20px';
                    piece.style.background = `hsl(${Math.random() * 360}, 100%, 50%)`;
                    piece.style.animationDelay = Math.random() * 0.5 + 's';
                    document.body.appendChild(piece);
                    setTimeout(() => piece.remove(), 3000);
                }, i * 50);
            }
        }

        window.onload = () => {
            renderAvatars();
            const saved = localStorage.getItem('currentUser');
            if (saved) {
                currentUser = JSON.parse(saved);
                showApp();
            } else {
                showLogin();
                setTimeout(() => speakES('Bienvenido a Facu Inglés. Toca un usuario o crea uno nuevo'), 1000);
            }
        };
    </script>
</body>
</html>
