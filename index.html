<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#6D5DF6" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="FACU INGLÉS 1D - App móvil de inglés para niños de 7 años" />
  <title>FACU INGLÉS 1D Pro Mobile</title>
  <style>
    :root{
      --bg1:#6D5DF6; --bg2:#FF66A3; --bg3:#00C2FF;
      --ink:#172033; --muted:#6B7280; --paper:#FFFFFF; --soft:#F6F7FB;
      --primary:#6D5DF6; --secondary:#FF66A3; --success:#12B886; --warning:#F59F00; --danger:#F03E3E;
      --healthy:#12B886; --unhealthy:#F03E3E;
      --radius:26px; --shadow:0 18px 45px rgba(23,32,51,.18);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
    }
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    html{height:100%;scroll-behavior:smooth}
    body{
      min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif;
      color:var(--ink);background:radial-gradient(circle at 20% 10%,#fff3 0 12%,transparent 13%),linear-gradient(135deg,var(--bg1),var(--bg2) 58%,var(--bg3));
      overflow-x:hidden;touch-action:manipulation;
    }
    button,input,select{font:inherit}
    button{border:0;cursor:pointer}
    img,svg{max-width:100%;display:block}
    .app-bg{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
    .bubble{position:absolute;border-radius:999px;background:#fff2;filter:blur(.3px);animation:float 18s ease-in-out infinite}
    .b1{width:180px;height:180px;left:-45px;top:8%}.b2{width:260px;height:260px;right:-120px;top:20%;animation-delay:4s}.b3{width:130px;height:130px;left:55%;bottom:5%;animation-delay:8s}
    @keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-35px) rotate(12deg)}}
    .screen{position:relative;z-index:1;min-height:100dvh;padding:14px;padding-bottom:calc(14px + var(--safe-bottom))}
    .hidden{display:none!important}
    .shell{max-width:1100px;margin:0 auto;background:rgba(255,255,255,.96);backdrop-filter:blur(18px);border:1px solid #ffffff66;border-radius:34px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;min-height:calc(100dvh - 28px)}

    /* === LOGIN === */
    .hero{padding:28px 22px 22px;text-align:center;background:linear-gradient(135deg,#fff,#f7f5ff)}
    .brand-mark{width:96px;height:96px;margin:0 auto 12px;border-radius:30px;display:grid;place-items:center;font-size:54px;background:linear-gradient(135deg,#ffe066,#ff99c8);box-shadow:0 14px 30px #ff66a344;animation:pop 2.8s ease-in-out infinite}
    @keyframes pop{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    h1{font-size:clamp(2rem,8vw,4rem);line-height:.98;letter-spacing:-.04em;color:#291B6F}
    .gradient-text{background:linear-gradient(135deg,var(--primary),var(--secondary));-webkit-background-clip:text;background-clip:text;color:transparent}
    .subtitle{margin-top:12px;color:var(--muted);font-weight:800;font-size:clamp(1rem,4vw,1.25rem)}
    .panel{padding:22px}
    .section-title{font-size:1.3rem;font-weight:900;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:12px}
    .section-title small{font-size:.85rem;color:var(--muted);font-weight:800}
    .profiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:14px;margin-bottom:18px}
    .profile-card,.add-card{background:#fff;border:2px solid #eef0f7;border-radius:24px;padding:16px;box-shadow:0 10px 24px #17203314;text-align:center;transition:.2s transform,.2s border-color}
    .profile-card:active,.add-card:active{transform:scale(.97)}
    .profile-card:hover{border-color:var(--primary)}
    .avatar{width:72px;height:72px;margin:0 auto 10px;border-radius:24px;display:grid;place-items:center;font-size:42px;background:linear-gradient(135deg,#eef2ff,#ffe3ef)}
    .profile-name{font-weight:900;font-size:1.08rem}
    .profile-meta{margin-top:8px;color:var(--muted);font-size:.9rem;font-weight:800;display:flex;justify-content:center;gap:10px}
    .delete-mini{margin-top:10px;background:#fff1f1;color:var(--danger);border-radius:14px;padding:8px 10px;font-size:.85rem;font-weight:900}
    .form-card{background:linear-gradient(135deg,#F8FAFF,#FFF7FB);border:2px dashed #c7d2fe;border-radius:26px;padding:18px}
    .input,.select{width:100%;border:2px solid #e5e7eb;border-radius:18px;padding:14px 16px;font-weight:900;font-size:1.05rem;outline:none;background:#fff}
    .input:focus,.select:focus{border-color:var(--primary);box-shadow:0 0 0 5px #6d5df620}
    .avatar-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:14px 0}
    .avatar-choice{aspect-ratio:1;border-radius:18px;background:#fff;border:2px solid #eef0f7;font-size:30px;display:grid;place-items:center}
    .avatar-choice.selected{border-color:var(--primary);background:#efeefe;box-shadow:0 0 0 4px #6d5df61c}
    .primary-btn,.secondary-btn,.ghost-btn{border-radius:20px;padding:14px 18px;font-weight:950;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;transition:transform .15s}
    .primary-btn{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;box-shadow:0 12px 26px #6d5df633}
    .primary-btn:active{transform:scale(.97)}
    .secondary-btn{background:#fff;color:var(--primary);border:2px solid #e7e7ff}
    .ghost-btn{background:#f4f5fb;color:var(--ink)}
    .full{width:100%}

    /* === TOP BAR === */
    .topbar{background:linear-gradient(135deg,#4230D8,#8C54FF 55%,#FF66A3);color:white;padding:14px 16px 18px;flex-shrink:0}
    .user-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .user-mini{display:flex;align-items:center;gap:12px;min-width:0}
    .user-mini .avatar{width:50px;height:50px;margin:0;font-size:28px;border-radius:18px;background:#fff;color:var(--ink)}
    .hello{font-size:.85rem;opacity:.9;font-weight:800}
    .user-title{font-size:1.15rem;font-weight:950;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .top-actions{display:flex;gap:8px}
    .icon-btn{width:44px;height:44px;border-radius:15px;background:#ffffff22;color:#fff;border:1px solid #ffffff55;font-size:20px;display:grid;place-items:center}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
    .stat{background:#ffffff22;border:1px solid #ffffff55;border-radius:16px;text-align:center;padding:10px 6px}
    .stat b{font-size:1.3rem;display:block;line-height:1}
    .stat span{font-size:.65rem;font-weight:900;opacity:.95;text-transform:uppercase;letter-spacing:.04em}

    /* === MAIN CONTENT AREA === */
    .content{padding:14px;background:#FAFBFF;flex:1;overflow-y:auto;padding-bottom:calc(80px + var(--safe-bottom))}
    .path-header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
    .path-header h2{font-size:1.4rem;letter-spacing:-.03em}
    .path-header p{color:var(--muted);font-weight:800;margin-top:4px;font-size:.92rem}
    .progress-pill{background:#fff;border:1px solid #edf0f8;border-radius:999px;padding:8px 12px;font-weight:950;color:var(--primary);white-space:nowrap;font-size:.9rem}

    /* === LESSON CARDS === */
    .level-header{font-size:1.1rem;font-weight:1000;color:#4230D8;margin:14px 0 8px;display:flex;align-items:center;gap:8px}
    .level-header::before{content:"";width:4px;height:20px;background:linear-gradient(180deg,var(--primary),var(--secondary));border-radius:4px}
    .lesson-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
    .lesson{position:relative;background:#fff;border:2px solid #eef0f7;border-radius:24px;padding:16px;box-shadow:0 12px 28px #17203312;overflow:hidden;transition:.2s transform,.2s border-color;cursor:pointer}
    .lesson:active{transform:scale(.98)}
    .lesson.done{border-color:#a7f3d0;background:linear-gradient(135deg,#fff,#ecfdf5)}
    .lesson.locked{opacity:.55;filter:grayscale(.2)}
    .lesson-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
    .lesson-icon{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;overflow:hidden;flex-shrink:0;background:linear-gradient(135deg,#eef2ff,#fff0f6)}
    .lesson-icon svg{width:100%;height:100%;display:block}
    .lesson-icon.bg-greet{background:linear-gradient(135deg,#fef3c7,#fed7aa)}
    .lesson-icon.bg-me{background:linear-gradient(135deg,#dbeafe,#e9d5ff)}
    .lesson-icon.bg-class{background:linear-gradient(135deg,#dcfce7,#bbf7d0)}
    .lesson-icon.bg-magic{background:linear-gradient(135deg,#fef9c3,#fde68a)}
    .lesson-icon.bg-feel{background:linear-gradient(135deg,#fce7f3,#fbcfe8)}
    .lesson-icon.bg-color{background:linear-gradient(135deg,#fff,#f3f4f8)}
    .lesson-icon.bg-num{background:linear-gradient(135deg,#dbeafe,#bfdbfe)}
    .lesson-icon.bg-school{background:linear-gradient(135deg,#fde68a,#fbbf24)}
    .lesson-icon.bg-fam{background:linear-gradient(135deg,#fce7f3,#f9a8d4)}
    .lesson-icon.bg-body{background:linear-gradient(135deg,#e9d5ff,#c4b5fd)}
    .lesson-icon.bg-anim{background:linear-gradient(135deg,#86efac,#bef264)}
    .lesson-icon.bg-food{background:linear-gradient(135deg,#fecaca,#fca5a5)}
    .lesson-icon.bg-rout{background:linear-gradient(135deg,#bae6fd,#7dd3fc)}
    .lesson-icon.bg-healthy{background:linear-gradient(135deg,#bbf7d0,#86efac)}
    .lesson-icon.bg-unhealthy{background:linear-gradient(135deg,#fecaca,#fca5a5)}
    .level{font-size:.7rem;font-weight:950;color:var(--muted);background:#f4f5fb;border-radius:999px;padding:6px 9px}
    .lesson h3{font-size:1.08rem;font-weight:950;margin-bottom:4px;line-height:1.15}
    .lesson p{color:var(--muted);font-weight:800;font-size:.85rem;line-height:1.3}
    .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
    .chip{font-size:.72rem;background:#f4f5fb;border-radius:999px;padding:5px 9px;font-weight:900;color:#596174}
    .status{margin-top:12px;display:flex;justify-content:space-between;align-items:center;font-weight:950;font-size:.85rem}
    .status small{color:var(--muted);font-size:.78rem}

    /* === ACTIVITY VIEW === */
    .activity{max-width:860px;margin:0 auto}
    .activity-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;background:#fff;padding:10px 14px;border-radius:18px;box-shadow:0 6px 16px #1720330f}
    .activity-head .left{display:flex;align-items:center;gap:10px;min-width:0}
    .mini-icon{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:linear-gradient(135deg,#eef2ff,#fff0f6);flex-shrink:0;overflow:hidden}
    .mini-icon svg{width:100%;height:100%}
    .mini-icon.bg-greet{background:linear-gradient(135deg,#fef3c7,#fed7aa)}
    .mini-icon.bg-me{background:linear-gradient(135deg,#dbeafe,#e9d5ff)}
    .mini-icon.bg-class{background:linear-gradient(135deg,#dcfce7,#bbf7d0)}
    .mini-icon.bg-magic{background:linear-gradient(135deg,#fef9c3,#fde68a)}
    .mini-icon.bg-feel{background:linear-gradient(135deg,#fce7f3,#fbcfe8)}
    .mini-icon.bg-color{background:linear-gradient(135deg,#fff,#f3f4f8)}
    .mini-icon.bg-num{background:linear-gradient(135deg,#dbeafe,#bfdbfe)}
    .mini-icon.bg-school{background:linear-gradient(135deg,#fde68a,#fbbf24)}
    .mini-icon.bg-fam{background:linear-gradient(135deg,#fce7f3,#f9a8d4)}
    .mini-icon.bg-body{background:linear-gradient(135deg,#e9d5ff,#c4b5fd)}
    .mini-icon.bg-anim{background:linear-gradient(135deg,#86efac,#bef264)}
    .mini-icon.bg-food{background:linear-gradient(135deg,#fecaca,#fca5a5)}
    .mini-icon.bg-rout{background:linear-gradient(135deg,#bae6fd,#7dd3fc)}
    .mini-icon.bg-healthy{background:linear-gradient(135deg,#bbf7d0,#86efac)}
    .mini-icon.bg-unhealthy{background:linear-gradient(135deg,#fecaca,#fca5a5)}
    .activity-head h2{font-size:1rem;font-weight:1000;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .activity-head p{font-size:.78rem;color:var(--muted);font-weight:800}
    .exit-btn{background:#fff1f1;color:var(--danger);border-radius:14px;padding:8px 12px;font-weight:900;font-size:.85rem;flex-shrink:0}
    .stepbar{height:10px;background:#e9ecf5;border-radius:999px;overflow:hidden;margin-bottom:14px}
    .stepbar>div{height:100%;width:0;background:linear-gradient(90deg,var(--primary),var(--secondary));border-radius:inherit;transition:.3s width}

    .card{background:#fff;border:1px solid #edf0f8;border-radius:26px;padding:18px;box-shadow:0 14px 35px #17203314;margin-bottom:12px}

    /* === FLASHCARD === */
    .flash-main{text-align:center}
    .scene-frame{background:linear-gradient(180deg,#dbeafe 0%,#fef3c7 60%,#bbf7d0 100%);border-radius:22px;padding:14px;margin:10px 0 14px;position:relative;overflow:hidden;min-height:200px;display:grid;place-items:center}
    .scene-frame.indoor{background:linear-gradient(180deg,#fef3c7 0%,#fed7aa 100%)}
    .scene-frame.night{background:linear-gradient(180deg,#1e1b4b 0%,#3730a3 100%);color:#fff}
    .scene-frame.kitchen{background:linear-gradient(180deg,#fef9c3 0%,#fde68a 100%)}
    .scene-frame.school{background:linear-gradient(180deg,#dbeafe 0%,#e9d5ff 100%)}
    .scene-frame.home{background:linear-gradient(180deg,#fce7f3 0%,#fef3c7 100%)}
    .scene-frame.healthy-bg{background:linear-gradient(180deg,#dcfce7 0%,#bbf7d0 100%)}
    .scene-frame.unhealthy-bg{background:linear-gradient(180deg,#fee2e2 0%,#fecaca 100%)}
    .scene-frame svg{width:100%;height:auto;max-height:240px}
    .word{font-size:clamp(2.4rem,11vw,4.4rem);font-weight:1000;letter-spacing:-.05em;color:#21175f;line-height:1;margin-top:4px}
    .syllables{display:inline-flex;flex-wrap:wrap;justify-content:center;gap:4px;margin:8px 0 4px}
    .syl{display:inline-block;padding:4px 10px;border-radius:12px;font-size:1.05rem;font-weight:1000;color:#fff;letter-spacing:.05em}
    .syl:nth-child(3n){background:#FF66A3}
    .syl:nth-child(3n+1){background:#6D5DF6}
    .syl:nth-child(3n+2){background:#00C2FF}
    .phonetic{display:inline-block;margin:6px 0;background:#f5f3ff;color:#5b21b6;border-radius:999px;padding:8px 14px;font-weight:950;font-family:monospace}
    .translation{font-size:1.35rem;font-weight:950;color:var(--ink);margin:8px 0;background:#fef3c7;display:inline-block;padding:6px 16px;border-radius:14px}
    .phrase{font-size:.95rem;color:var(--muted);font-weight:850;background:#f8fafc;border-radius:16px;padding:10px;margin-top:8px}
    .phrase b{color:var(--ink)}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
    .actions .primary-btn,.actions .secondary-btn{padding:13px 14px;font-size:.95rem;min-height:50px}

    /* === GAME COMMON === */
    .question{text-align:center;font-size:clamp(1.3rem,5.5vw,2rem);font-weight:1000;letter-spacing:-.03em;margin-bottom:8px;line-height:1.15}
    .question small{display:block;color:var(--muted);font-weight:800;font-size:.7em;margin-top:4px}
    .game-note{text-align:center;color:var(--muted);font-weight:850;margin:6px 0 12px;font-size:.92rem}
    .options{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
    .option{background:#fff;border:2px solid #e9ecf5;border-radius:20px;padding:14px;min-height:80px;font-weight:950;font-size:1rem;box-shadow:0 8px 18px #1720330f;transition:transform .15s,border-color .2s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
    .option:active{transform:scale(.97)}
    .option .ic{font-size:2.4rem;line-height:1}
    .option .lbl-es{font-size:1rem;color:var(--ink)}
    .option .lbl-en{font-size:.78rem;color:#6b7280;font-weight:800;margin-top:2px}
    .option.correct{border-color:var(--success);background:#ecfdf5;color:#087f5b;animation:pulseGood .5s}
    .option.wrong{border-color:var(--danger);background:#fff5f5;color:#c92a2a;animation:shake .4s}
    @keyframes pulseGood{50%{transform:scale(1.06)}}
    @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
    .feedback{margin-top:10px;border-radius:18px;padding:12px;text-align:center;font-weight:1000;display:none}
    .feedback.show{display:block;animation:bounceIn .4s}
    .feedback.good{background:#ecfdf5;color:#087f5b}
    .feedback.bad{background:#fff5f5;color:#c92a2a}
    @keyframes bounceIn{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}

    /* === MEMORY === */
    .memory-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
    .mem{aspect-ratio:1;border-radius:18px;background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;font-size:clamp(1rem,5vw,2rem);font-weight:1000;display:grid;place-items:center;text-align:center;padding:6px;box-shadow:0 8px 16px #1720331a;transition:transform .18s}
    .mem.flipped{background:#fff;color:var(--ink);border:2px solid var(--primary)}
    .mem.matched{background:#ecfdf5;color:#087f5b;border:2px solid var(--success);animation:pulseGood .5s}

    /* === SCENE TAP === */
    .scene-objects{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px;margin-top:12px}
    .scene-obj{background:#fff;border:2px solid #fff;border-radius:18px;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:2.8rem;cursor:pointer;transition:transform .15s,border-color .2s;box-shadow:0 6px 14px #1720331a;position:relative;padding:8px}
    .scene-obj:active{transform:scale(.92)}
    .scene-obj.correct{border-color:var(--success);background:#ecfdf5;animation:pulseGood .5s}
    .scene-obj.wrong{border-color:var(--danger);background:#fff5f5;animation:shake .4s}
    .scene-obj.faded{opacity:.35;pointer-events:none}
    .scene-obj svg{max-width:50%;max-height:50%}
    .scene-obj .so-label{font-size:.78rem;font-weight:1000;color:var(--ink);text-align:center;line-height:1}
    .scene-obj .so-en{font-size:.65rem;color:var(--muted);font-weight:800;line-height:1}

    /* === SENTENCE BUILDER === */
    .sentence-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}
    .tile{background:#f3f4f8;border-radius:14px;padding:10px 14px;font-weight:1000;transition:transform .15s,opacity .2s;font-size:1rem}
    .tile:active{transform:scale(.95)}
    .dropzone{min-height:64px;background:#fff;border:2px dashed #cdd3e6;border-radius:18px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;color:#9ca3af;font-weight:800}
    .dropzone .tile{background:linear-gradient(135deg,#eef2ff,#fef3f9);color:var(--ink)}

    /* === DIALOG === */
    .dialog-area{display:flex;flex-direction:column;gap:6px;background:#f8fafc;border-radius:20px;padding:12px;min-height:180px;max-height:320px;overflow-y:auto;margin-bottom:10px}
    .dialog-bubble{padding:12px 16px;margin:6px 0;max-width:80%;box-shadow:0 4px 10px #1720331a;animation:slideIn .35s;border-radius:18px;line-height:1.3}
    .dialog-bubble small{display:block;opacity:.75;font-size:.78rem;margin-top:3px}
    .dialog-bubble.them{background:linear-gradient(135deg,#eef2ff,#fef3f9);align-self:flex-start;border-bottom-left-radius:6px}
    .dialog-bubble.you{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;align-self:flex-end;border-bottom-right-radius:6px;margin-left:auto}
    @keyframes slideIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .dialog-char{display:flex;align-items:center;gap:6px;font-weight:900;font-size:.78rem;color:var(--muted);margin-top:4px}
    .dialog-char .pic{font-size:1.4rem}
    .dialog-replies{display:grid;gap:8px}
    .reply-btn{background:#fff;border:2px solid #e9ecf5;border-radius:16px;padding:12px;text-align:left;font-weight:950;display:flex;align-items:center;gap:10px;transition:transform .15s,border-color .2s;font-size:.95rem}
    .reply-btn:active{transform:scale(.98)}
    .reply-btn .flag{font-size:1.3rem;flex-shrink:0}
    .reply-btn .es{color:var(--muted);font-weight:800;font-size:.82rem;display:block;margin-top:2px}
    .reply-btn.correct{border-color:var(--success);background:#ecfdf5}
    .reply-btn.wrong{border-color:var(--danger);background:#fff5f5}

    /* === SPEED ROUND === */
    .speed-bar{display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:8px 12px;margin-bottom:10px;box-shadow:0 6px 14px #1720330f}
    .speed-timer{flex:1;height:12px;background:#fef2f2;border-radius:999px;overflow:hidden}
    .speed-timer>div{height:100%;background:linear-gradient(90deg,var(--success),var(--warning),var(--danger));border-radius:inherit;transition:width .1s linear}
    .speed-lives{font-size:1.1rem;font-weight:1000;letter-spacing:2px}
    .speed-score{font-weight:1000;color:var(--primary);font-size:1.1rem}

    /* === HEALTHY/UNHEALTHY SORT === */
    .sort-board{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
    .sort-bin{background:#fff;border:3px dashed;border-radius:20px;padding:12px;min-height:140px}
    .sort-bin.healthy{border-color:var(--healthy);background:linear-gradient(180deg,#fff,#ecfdf5)}
    .sort-bin.unhealthy{border-color:var(--unhealthy);background:linear-gradient(180deg,#fff,#fef2f2)}
    .sort-bin h4{font-size:.95rem;text-align:center;margin-bottom:8px;font-weight:1000}
    .sort-bin.healthy h4{color:#087f5b}
    .sort-bin.unhealthy h4{color:#c92a2a}
    .sort-bin .items{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
    .sort-bin.over{transform:scale(1.03);box-shadow:0 0 0 4px #6d5df633}
    .sort-tray{background:#f4f5fb;border-radius:18px;padding:12px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px;min-height:80px}
    .sort-pill{background:#fff;border:2px solid #e9ecf5;border-radius:14px;padding:10px 12px;font-weight:950;font-size:.92rem;cursor:grab;user-select:none;box-shadow:0 4px 8px #1720330f;transition:transform .15s;display:flex;align-items:center;gap:6px}
    .sort-pill .ic{font-size:1.4rem}
    .sort-pill:active{cursor:grabbing;transform:scale(1.05)}
    .sort-pill.placed-h{background:#ecfdf5;border-color:var(--success);color:#087f5b}
    .sort-pill.placed-u{background:#fef2f2;border-color:var(--danger);color:#c92a2a}
    .sort-pill.dragging{opacity:.4}

    /* === COMPLETE === */
    .stars-row{display:flex;justify-content:center;gap:8px;margin:12px 0}
    .star-big{font-size:3rem;opacity:.25;transform:scale(.7);transition:opacity .4s,transform .4s}
    .star-big.shown{opacity:1;transform:scale(1)}
    .big-emoji{font-size:clamp(4rem,18vw,8rem);line-height:1;margin:6px 0;display:inline-block;animation:bounceIn .55s cubic-bezier(.28,1.6,.5,1) both}

    /* === BOTTOM NAV — sticky always visible === */
    .bottom-bar{position:sticky;bottom:0;z-index:10;background:rgba(255,255,255,.97);backdrop-filter:blur(18px);border-top:1px solid #eef0f7;padding:10px 12px calc(10px + var(--safe-bottom));display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
    .nav-tab{background:transparent;color:#697084;border-radius:14px;padding:6px 4px;font-weight:950;min-height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
    .nav-tab span{font-size:1.3rem;line-height:1}
    .nav-tab b{font-size:.7rem}
    .nav-tab.active{background:#171F35;color:#fff}

    /* === LESSON BOTTOM ACTION (fixed during exercises) === */
    .action-bar{position:sticky;bottom:0;z-index:11;background:linear-gradient(180deg,transparent,#FAFBFF 30%);padding:12px 0 calc(12px + var(--safe-bottom));margin-top:8px}
    .action-bar .primary-btn{width:100%;font-size:1.05rem;min-height:58px;box-shadow:0 -4px 20px #6d5df633}
    .action-bar.with-back{display:grid;grid-template-columns:auto 1fr;gap:8px}
    .action-bar.with-back .ghost-btn{min-height:58px;padding:0 18px}

    /* === COACH (mascota) === */
    .coach{position:fixed;right:14px;bottom:calc(76px + var(--safe-bottom));z-index:20;width:56px;height:56px;border-radius:20px;background:linear-gradient(135deg,#FFD43B,#FF66A3);box-shadow:0 14px 28px #17203333;border:3px solid #fff;font-size:26px}
    .toast{position:fixed;left:50%;bottom:calc(140px + var(--safe-bottom));transform:translateX(-50%) translateY(20px);z-index:30;background:#171F35;color:#fff;padding:12px 16px;border-radius:999px;font-weight:900;opacity:0;pointer-events:none;transition:.25s;max-width:92%;text-align:center;font-size:.92rem}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

    /* === LIBRARY & PRACTICE === */
    .library-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
    .word-mini{background:#fff;border:1px solid #edf0f8;border-radius:20px;padding:12px;text-align:center}
    .word-mini .e{font-size:2.4rem}
    .word-mini b{display:block;margin-top:5px;font-size:.95rem}
    .word-mini span{color:var(--muted);font-size:.82rem;font-weight:800}
    .practice-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
    .practice-card{background:#fff;border:1px solid #edf0f8;border-radius:24px;padding:16px;box-shadow:0 10px 22px #17203312}
    .practice-card h3{font-size:1.05rem;margin:6px 0 4px}
    .practice-card p{color:var(--muted);font-weight:800;font-size:.88rem}
    .audio-badge{display:inline-flex;align-items:center;gap:6px;background:#eef2ff;color:#4338ca;border-radius:999px;padding:6px 10px;font-weight:950;font-size:.78rem;margin-top:8px}
    .quick-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin-top:8px}
    .game-modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
    .game-mode{background:#fff;border:2px solid #eef0f7;border-radius:20px;padding:14px;text-align:center;cursor:pointer;transition:transform .15s,border-color .2s;box-shadow:0 6px 14px #1720330f}
    .game-mode:active{transform:scale(.97)}
    .game-mode:hover{border-color:var(--primary)}
    .game-mode .icon{font-size:2.2rem;margin-bottom:4px;display:block}
    .game-mode b{display:block;font-size:.95rem;margin-bottom:2px}
    .game-mode small{color:var(--muted);font-weight:800;font-size:.74rem}

    /* === PARENTS === */
    .parent-card{background:#fff;border:1px solid #edf0f8;border-radius:24px;padding:16px;box-shadow:0 10px 22px #17203312}
    .parent-card h3{font-size:1.1rem;margin-bottom:8px}
    .parent-card ul{padding-left:18px;color:#4b5563;font-weight:750;line-height:1.55;font-size:.92rem}
    .parent-card label{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid #f1f3f7;font-weight:900;font-size:.95rem}
    .parent-card label:first-of-type{border-top:0}
    .parent-card .select{margin-top:6px}

    /* === TWEMOJI IMAGES (emojis dibujados de Twitter) ===
       Se ven IGUAL en todos los dispositivos. Más expresivos que los del sistema.
    */
    .tw{display:inline-block;vertical-align:middle;width:1em;height:1em;line-height:1}
    .tw-xl{width:1.4em;height:1.4em}
    .ic .tw{width:48px;height:48px}
    .scene-obj .tw{width:60%;height:60%;max-width:60px;max-height:60px}
    .word-mini .e .tw{width:48px;height:48px}
    .practice-card .tw{width:48px;height:48px}
    .scene-frame .tw{width:auto;height:auto}
    .reply-btn .flag .tw{width:24px;height:24px}
    .lesson-meta-icon .tw{width:32px;height:32px}
    img.tw{display:inline-block}

    /* === GAMIFICACIÓN PROFESIONAL ESTILO DUOLINGO === */

    /* Mascota lechuza animada */
    .mascot-stage{position:relative;display:flex;justify-content:center;align-items:center;padding:14px 0;min-height:130px}
    .mascot{position:relative;width:120px;height:120px;transition:transform .3s}
    .mascot-body{width:100%;height:100%;display:grid;place-items:center;font-size:88px;animation:mascotIdle 3s ease-in-out infinite}
    @keyframes mascotIdle{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-6px) rotate(2deg)}}
    .mascot.happy .mascot-body{animation:mascotHappy .8s ease-in-out infinite}
    @keyframes mascotHappy{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-12px) rotate(-8deg)}75%{transform:translateY(-12px) rotate(8deg)}}
    .mascot.celebrate .mascot-body{animation:mascotCelebrate .6s ease-in-out 3}
    @keyframes mascotCelebrate{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.3) rotate(15deg)}}
    .mascot.sad .mascot-body{animation:mascotSad 1s ease-in-out infinite;filter:grayscale(.4)}
    @keyframes mascotSad{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(4px) scale(.95)}}
    .speech-bubble{position:absolute;background:#fff;color:var(--ink);padding:10px 14px;border-radius:18px;font-weight:900;font-size:.95rem;box-shadow:0 6px 20px #17203322;animation:bubbleIn .4s cubic-bezier(.28,1.6,.5,1);max-width:200px;line-height:1.3;border:2px solid #eef0f7;z-index:5}
    .speech-bubble::after{content:"";position:absolute;width:14px;height:14px;background:#fff;border-right:2px solid #eef0f7;border-bottom:2px solid #eef0f7}
    .speech-bubble.left{right:calc(50% + 65px);top:30%}
    .speech-bubble.left::after{right:-9px;top:14px;transform:rotate(-45deg)}
    .speech-bubble.right{left:calc(50% + 65px);top:30%}
    .speech-bubble.right::after{left:-9px;top:14px;transform:rotate(135deg)}
    @keyframes bubbleIn{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}

    /* Gemas y XP estilo Duolingo */
    .gem{display:inline-block;width:18px;height:18px;background:linear-gradient(135deg,#ef4444 0%,#dc2626 50%,#991b1b 100%);clip-path:polygon(20% 0,80% 0,100% 30%,80% 100%,20% 100%,0 30%);animation:gemSparkle 2.5s ease-in-out infinite;vertical-align:middle}
    @keyframes gemSparkle{0%,100%{filter:brightness(1)}50%{filter:brightness(1.4)}}
    .gem-fly{position:fixed;z-index:100;pointer-events:none;animation:gemFly 1s ease-in forwards;font-size:24px}
    @keyframes gemFly{from{opacity:1;transform:translate(0,0) scale(1)}to{opacity:0;transform:translate(var(--dx,0),var(--dy,-100px)) scale(.4)}}
    .xp-popup{position:absolute;color:#16a34a;font-weight:1000;font-size:1.3rem;animation:xpFloat 1.4s ease-out forwards;pointer-events:none;text-shadow:0 2px 8px #fff;z-index:50}
    @keyframes xpFloat{0%{opacity:0;transform:translateY(20px) scale(.5)}30%{opacity:1;transform:translateY(0) scale(1.1)}100%{opacity:0;transform:translateY(-50px) scale(1)}}

    /* Path de Duolingo (camino con burbujas) */
    .lesson-path{display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:6px;position:relative}
    .path-node{position:relative;width:88px;height:88px;border-radius:50%;display:grid;place-items:center;background:#fff;border:6px solid #e9ecf5;box-shadow:0 6px 0 #cdd3e6,0 12px 24px #1720331a;cursor:pointer;transition:transform .2s}
    .path-node:active{transform:translateY(2px)}
    .path-node:not(.locked):not(.done):hover{transform:translateY(-3px)}
    .path-node.done{background:linear-gradient(135deg,#22c55e,#16a34a);border-color:#15803d;box-shadow:0 6px 0 #166534,0 12px 24px #16a34a55}
    .path-node.done .node-icon{filter:drop-shadow(0 2px 4px #00000033)}
    .path-node.current{background:linear-gradient(135deg,#fef3c7,#fbbf24);border-color:#f59e0b;box-shadow:0 6px 0 #d97706,0 0 0 0 #fbbf2466,0 12px 24px #fbbf2455;animation:pulseRing 2s ease-in-out infinite}
    @keyframes pulseRing{0%,100%{box-shadow:0 6px 0 #d97706,0 0 0 0 #fbbf2466,0 12px 24px #fbbf2455}50%{box-shadow:0 6px 0 #d97706,0 0 0 14px #fbbf2400,0 12px 24px #fbbf2455}}
    .path-node.locked{background:#f4f5fb;border-color:#cdd3e6;cursor:not-allowed;opacity:.6}
    .path-node.locked .node-icon{filter:grayscale(1) opacity(.5)}
    .node-icon{width:54px;height:54px;display:grid;place-items:center}
    .node-icon img.tw,.node-icon svg{width:54px;height:54px}
    .path-node .star-badge{position:absolute;top:-8px;right:-8px;background:#fbbf24;color:#fff;border-radius:50%;width:28px;height:28px;display:grid;place-items:center;font-size:14px;font-weight:1000;border:3px solid #fff;box-shadow:0 2px 6px #00000033}
    .node-label{margin-top:4px;background:#fff;padding:6px 12px;border-radius:14px;font-weight:1000;font-size:.85rem;border:2px solid #eef0f7;box-shadow:0 2px 6px #1720330f;text-align:center;max-width:160px}
    .node-label small{display:block;color:var(--muted);font-size:.7rem;font-weight:800;margin-top:2px}
    .path-connector{width:6px;height:38px;background:repeating-linear-gradient(180deg,#cdd3e6 0 6px,transparent 6px 12px);margin:-2px 0}
    .path-connector.done{background:linear-gradient(180deg,#22c55e,#16a34a)}

    /* Hearts (vidas) y streak */
    .top-stats-row{display:flex;align-items:center;gap:8px;justify-content:flex-end;flex-wrap:wrap}
    .top-stat-pill{background:#ffffff22;border:1px solid #ffffff44;border-radius:999px;padding:5px 10px;color:#fff;font-weight:1000;font-size:.85rem;display:inline-flex;align-items:center;gap:4px}
    .top-stat-pill.streak{background:#f59e0b;border-color:#d97706}
    .top-stat-pill.gems{background:#ef4444;border-color:#dc2626}
    .top-stat-pill.hearts{background:#fff;color:#ef4444;border-color:#fee2e2}

    /* Activity progress bar mejorado */
    .activity-progress{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.96);padding:10px 14px;border-radius:18px;margin-bottom:10px;box-shadow:0 4px 12px #1720330f;position:sticky;top:0;z-index:8;backdrop-filter:blur(10px)}
    .progress-close{background:transparent;color:var(--muted);font-size:1.5rem;width:32px;height:32px;display:grid;place-items:center;font-weight:900;line-height:1}
    .progress-close:hover{color:var(--ink)}
    .progress-track{flex:1;height:14px;background:#e9ecf5;border-radius:999px;overflow:hidden;position:relative}
    .progress-fill{height:100%;background:linear-gradient(90deg,#fbbf24,#22c55e);border-radius:inherit;transition:width .5s cubic-bezier(.4,0,.2,1);position:relative;overflow:hidden}
    .progress-fill::after{content:"";position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(90deg,transparent,#ffffff66 50%,transparent);animation:progressShine 2s linear infinite}
    @keyframes progressShine{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
    .progress-hearts{font-weight:1000;color:#ef4444;font-size:1rem;display:flex;align-items:center;gap:2px}

    /* Picture Card grande para flashcard sin texto dependiente */
    .picture-card{background:linear-gradient(135deg,#fef3c7,#fed7aa);border-radius:32px;padding:24px;text-align:center;position:relative;overflow:hidden;box-shadow:0 14px 35px #1720331a;border:4px solid #fff}
    .picture-card.healthy-bg{background:linear-gradient(135deg,#dcfce7,#bbf7d0)}
    .picture-card.unhealthy-bg{background:linear-gradient(135deg,#fee2e2,#fecaca)}
    .picture-card.indoor{background:linear-gradient(135deg,#dbeafe,#e9d5ff)}
    .picture-card.morning{background:linear-gradient(135deg,#fef9c3,#fde68a)}
    .picture-card.night{background:linear-gradient(135deg,#1e1b4b,#3730a3);color:#fff}
    .picture-card .big-pic{margin:10px auto;width:140px;height:140px;background:#fff;border-radius:32px;display:grid;place-items:center;box-shadow:0 8px 24px #00000022;animation:bigPicFloat 3s ease-in-out infinite}
    @keyframes bigPicFloat{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-8px) rotate(3deg)}}
    .picture-card .big-pic img.tw{width:100px;height:100px}
    .picture-card .word-en{font-size:clamp(2rem,9vw,3.6rem);font-weight:1000;letter-spacing:-.04em;line-height:1;margin:8px 0;color:#291B6F}
    .picture-card.night .word-en{color:#fff}
    .picture-card .word-es{display:inline-block;background:#fff;color:var(--ink);padding:6px 16px;border-radius:14px;font-weight:1000;font-size:1.15rem;margin-top:6px;box-shadow:0 4px 10px #00000011}
    .listen-big-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;border-radius:20px;padding:16px 24px;font-weight:1000;font-size:1.1rem;box-shadow:0 8px 20px #6d5df633;margin-top:10px;min-height:58px;width:100%;animation:listenPulse 2.5s ease-in-out infinite}
    .listen-big-btn:active{transform:scale(.97)}
    @keyframes listenPulse{0%,100%{box-shadow:0 8px 20px #6d5df633}50%{box-shadow:0 8px 20px #6d5df666,0 0 0 8px #6d5df622}}

    /* Picture Match (2 imágenes, sin texto) */
    .pic-match-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
    .pic-choice{aspect-ratio:1;background:#fff;border:4px solid #e9ecf5;border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-shadow:0 10px 24px #17203314;transition:transform .15s,border-color .2s;cursor:pointer;padding:14px;position:relative}
    .pic-choice:active{transform:scale(.94)}
    .pic-choice img.tw{width:60%;height:60%;max-width:90px;max-height:90px}
    .pic-choice .pc-label{font-weight:1000;font-size:.95rem;color:var(--ink);text-align:center;line-height:1.1}
    .pic-choice .pc-en{font-size:.72rem;color:var(--muted);font-weight:800;margin-top:-2px}
    .pic-choice.correct{border-color:#22c55e;background:#dcfce7;animation:choiceWin .6s}
    .pic-choice.wrong{border-color:#ef4444;background:#fee2e2;animation:choiceShake .4s}
    @keyframes choiceWin{0%,100%{transform:scale(1)}30%{transform:scale(1.12)}}
    @keyframes choiceShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}

    /* Pop the Balloon */
    .balloon-arena{position:relative;height:420px;background:linear-gradient(180deg,#dbeafe 0%,#fef9c3 70%,#bbf7d0 100%);border-radius:24px;overflow:hidden;border:3px solid #fff;box-shadow:inset 0 4px 12px #0001}
    /* === GLOBOS REDISEÑADOS ===
       - Globo translúcido pastel para que la imagen interior se vea clara
       - Borde definido y sombra para forma de globo sin tapar el contenido
       - Imagen grande (50px) bien visible dentro
       - Etiqueta blanca con texto BIEN GRANDE debajo
    */
    .balloon{position:absolute;width:96px;height:140px;cursor:pointer;animation:balloonRise linear forwards;display:flex;align-items:center;justify-content:center;flex-direction:column;will-change:transform}
    @keyframes balloonRise{from{transform:translateY(420px)}to{transform:translateY(-150px)}}
    .balloon-body{width:84px;height:96px;border-radius:50% 50% 48% 48% / 60% 60% 40% 40%;display:grid;place-items:center;position:relative;background:rgba(255,255,255,.92);border:4px solid currentColor;box-shadow:0 6px 14px #00000033,inset -6px -8px 12px #00000011}
    .balloon-body::before{content:"";position:absolute;width:18px;height:22px;background:#ffffff;border-radius:50%;top:10px;left:14px;opacity:.7;filter:blur(3px)}
    .balloon-body::after{content:"";position:absolute;bottom:-10px;left:50%;width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-top:12px solid currentColor;transform:translateX(-50%)}
    .balloon-body img.tw{width:54px;height:54px;position:relative;z-index:2}
    .balloon-string{width:1.5px;height:12px;background:#374151;margin-top:8px}
    .balloon-label{margin-top:3px;background:#171F35;color:#fff;font-size:.78rem;font-weight:1000;padding:3px 10px;border-radius:10px;box-shadow:0 3px 8px #00000044;white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis;letter-spacing:.01em}
    .balloon.popped{animation:balloonPop .35s ease-out forwards}
    @keyframes balloonPop{to{transform:scale(1.6);opacity:0}}
    .balloon.missed{animation:balloonMiss .4s forwards}
    @keyframes balloonMiss{to{opacity:.3}}

    /* Para lecciones de COLORES: el globo se llena del color que enseña */
    .balloon.color-lesson .balloon-body{background:currentColor;border-color:rgba(0,0,0,.15)}
    .balloon.color-lesson .balloon-body img.tw{filter:drop-shadow(0 2px 4px rgba(0,0,0,.3))}
    .balloon.popped{animation:balloonPop .35s ease-out forwards}
    @keyframes balloonPop{to{transform:scale(1.6);opacity:0}}
    .balloon.missed{animation:balloonMiss .4s forwards}
    @keyframes balloonMiss{to{opacity:.3}}

    /* Tap to Hear */
    .tap-hear-card{background:#fff;border-radius:32px;padding:24px;text-align:center;box-shadow:0 14px 35px #1720331a}
    .tap-hear-pic{width:160px;height:160px;margin:0 auto;background:linear-gradient(135deg,#fef3c7,#fed7aa);border-radius:50%;display:grid;place-items:center;cursor:pointer;animation:tapPulse 2s ease-in-out infinite;box-shadow:0 14px 30px #fbbf2455}
    @keyframes tapPulse{0%,100%{box-shadow:0 14px 30px #fbbf2455,0 0 0 0 #fbbf24aa}50%{box-shadow:0 14px 30px #fbbf2455,0 0 0 18px #fbbf2400}}
    .tap-hear-pic img.tw{width:110px;height:110px}
    .tap-hear-pic:active{transform:scale(.94)}
    .tap-hear-hint{margin-top:14px;font-weight:1000;color:var(--muted);font-size:1rem;display:flex;align-items:center;justify-content:center;gap:6px}

    /* Repeat after me */
    .repeat-stage{background:linear-gradient(135deg,#eef2ff,#fef3f9);border-radius:24px;padding:20px;text-align:center;position:relative}
    .repeat-mic{width:120px;height:120px;margin:14px auto;border-radius:50%;background:linear-gradient(135deg,#ef4444,#dc2626);display:grid;place-items:center;color:#fff;font-size:54px;box-shadow:0 14px 30px #ef444455;animation:micPulse 1.4s ease-in-out infinite}
    @keyframes micPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
    .repeat-progress{height:14px;background:#e9ecf5;border-radius:999px;overflow:hidden;margin-top:14px}
    .repeat-progress>div{height:100%;background:linear-gradient(90deg,#22c55e,#16a34a);width:0;border-radius:inherit;transition:width .1s linear}

    /* Image-image memory (versión sin texto) */
    .imem-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
    .imem-card{aspect-ratio:1;background:linear-gradient(135deg,#6D5DF6,#FF66A3);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;box-shadow:0 6px 16px #1720331a;color:#fff;transition:transform .25s,background .3s;perspective:1000px;position:relative;overflow:hidden;padding:6px}
    .imem-card .qmark{font-size:2.4rem;font-weight:1000;animation:qmarkFloat 2s ease-in-out infinite}
    @keyframes qmarkFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
    .imem-card.flipped{background:#fff;border:3px solid var(--primary);transform:rotateY(180deg) scale(1.05)}
    .imem-card.flipped .qmark{display:none}
    .imem-card.flipped img.tw{width:55%;height:55%;transform:rotateY(180deg)}
    .imem-card.flipped .imem-label{transform:rotateY(180deg);font-size:.78rem;font-weight:1000;color:var(--ink);text-align:center;line-height:1}
    .imem-card.matched{background:linear-gradient(135deg,#22c55e,#16a34a);border:3px solid #15803d;animation:matchedGlow 1s}
    .imem-card.matched .imem-label{color:#fff}
    @keyframes matchedGlow{0%,100%{box-shadow:0 6px 16px #1720331a}50%{box-shadow:0 6px 16px #16a34a88,0 0 0 8px #16a34a44}}
    .imem-card.matched img.tw{width:55%;height:55%;filter:drop-shadow(0 2px 4px #00000044)}

    /* Cofre del tesoro al completar */
    .treasure-stage{text-align:center;padding:30px 16px}
    .treasure-chest{width:160px;height:140px;margin:0 auto;position:relative;cursor:pointer;animation:chestBob 1.6s ease-in-out infinite}
    @keyframes chestBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    .chest-base{width:160px;height:90px;background:linear-gradient(180deg,#92400e,#78350f);border-radius:0 0 14px 14px;border:3px solid #451a03;position:absolute;bottom:0;box-shadow:0 8px 20px #00000044}
    .chest-lid{width:160px;height:60px;background:linear-gradient(180deg,#a16207,#854d0e);border-radius:14px 14px 0 0;border:3px solid #451a03;position:absolute;top:0;left:0;transform-origin:bottom;transition:transform .8s cubic-bezier(.5,0,.5,1.5)}
    .chest-lock{width:24px;height:30px;background:#fbbf24;border-radius:6px 6px 4px 4px;position:absolute;left:50%;top:48px;transform:translateX(-50%);border:2px solid #451a03}
    .treasure-chest.open .chest-lid{transform:rotateX(-110deg) translateY(-4px)}
    .treasure-chest.open .chest-lock{display:none}
    .treasure-glow{position:absolute;inset:0;background:radial-gradient(circle,#fde68a 0%,transparent 70%);opacity:0;animation:treasureGlow .6s 0.5s forwards}
    @keyframes treasureGlow{to{opacity:1;transform:scale(1.3)}}

    /* Combo flash banner */
    .combo-banner{position:fixed;top:30%;left:0;right:0;text-align:center;z-index:60;pointer-events:none}
    .combo-banner span{display:inline-block;font-size:clamp(2.4rem,9vw,4rem);font-weight:1000;background:linear-gradient(135deg,#fbbf24,#ef4444,#a855f7);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 30px #fbbf2466;animation:comboBanner 1.2s forwards;letter-spacing:-.05em}
    @keyframes comboBanner{0%{opacity:0;transform:scale(.5) rotate(-15deg)}25%{opacity:1;transform:scale(1.2) rotate(5deg)}75%{opacity:1;transform:scale(1) rotate(0)}100%{opacity:0;transform:scale(1.1) translateY(-30px)}}

    /* Respond to errors visually */
    .activity-shake{animation:shake .4s}

    /* === MODAL para confirmaciones (funciona en todo móvil) === */
    .modal-mask{position:fixed;inset:0;background:#0008;z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
    .modal-mask.show{display:flex;animation:fadeIn .2s}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    .modal-card{background:#fff;border-radius:24px;padding:22px;max-width:340px;width:100%;text-align:center;box-shadow:0 24px 60px #0006;animation:bounceIn .3s}
    .modal-card h3{font-size:1.2rem;font-weight:1000;margin-bottom:10px}
    .modal-card p{color:var(--muted);font-weight:850;margin-bottom:16px;line-height:1.4}
    .modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .modal-actions .ghost-btn{min-height:50px}
    .modal-actions .danger-btn{background:#fee2e2;color:#c92a2a;border-radius:18px;padding:12px;font-weight:1000;min-height:50px}
    .modal-actions .primary-btn{min-height:50px}

    /* === Panel inline de continuar/saltar tras error === */
    .help-panel{margin-top:10px;background:linear-gradient(135deg,#fffbeb,#fef3c7);border:2px solid #fbbf24;border-radius:18px;padding:12px;text-align:center;animation:bounceIn .35s}
    .help-panel.hidden{display:none}
    .help-panel .msg{font-weight:950;color:#7c2d12;margin-bottom:10px;font-size:.95rem}
    .help-panel .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .help-panel button{border-radius:14px;padding:12px;font-weight:1000;min-height:48px;font-size:.92rem}
    .help-panel .skip{background:#fff;color:#7c2d12;border:2px solid #fbbf24}
    .help-panel .show-answer{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff}
    .confetti{position:fixed;top:-18px;width:12px;height:12px;border-radius:4px;z-index:50;animation:fall 2.8s linear forwards}
    @keyframes fall{to{transform:translateY(110dvh) rotate(720deg);opacity:0}}
    .combo-pop{position:fixed;top:40%;left:50%;transform:translate(-50%,-50%);font-size:3.2rem;font-weight:1000;color:#fff;text-shadow:0 4px 16px #6d5df6cc,0 0 30px #ff66a3aa;z-index:60;pointer-events:none;animation:comboPop .9s forwards}
    @keyframes comboPop{0%{transform:translate(-50%,-50%) scale(.4);opacity:0}30%{transform:translate(-50%,-50%) scale(1.2);opacity:1}100%{transform:translate(-50%,-150%) scale(.9);opacity:0}}

    @media(max-width:760px){
      .screen{padding:0}
      .shell{border-radius:0;min-height:100dvh}

      .stats{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}

      .scene-objects{grid-template-columns:repeat(3,1fr)}
      .sort-board{grid-template-columns:1fr 1fr}
    }
    @media(max-width:420px){
      .profiles{grid-template-columns:repeat(2,1fr)}

      .card{padding:14px}
    }

</head>

/* === HELPERS === */
function $(id){return document.getElementById(id)}
function appState(){return JSON.parse(localStorage.getItem(STORE)||'{"users":[]}')}
function saveState(s){localStorage.setItem(STORE,JSON.stringify(s))}
function userData(){return currentUser?.data||{stars:0,badges:0,completed:[],streak:0,lastDay:null,wordsSeen:{}}}
function setCurrentUser(u){currentUser=u;localStorage.setItem(STORE+'_current',u?u.id:'')}
function persistUser(){const s=appState();const idx=s.users.findIndex(u=>u.id===currentUser.id);if(idx>=0){s.users[idx]=currentUser;saveState(s)}}
function persistPrefs(){if(currentUser){currentUser.prefs=prefs;persistUser()}}
function loadPrefs(){if(currentUser?.prefs)prefs={...prefs,...currentUser.prefs}}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.remove('show'),2200)}

/* === Modal de confirmación (en lugar de confirm() nativo) === */
let _modalCb=null;
function showModal(title,msg,confirmText,onConfirm){
  $('modalTitle').textContent=title;
  $('modalMsg').textContent=msg;
  $('modalConfirmBtn').textContent=confirmText||'Sí';
  _modalCb=onConfirm;
  $('modalMask').classList.add('show');
}
function closeModal(e){if(e&&e.target.id!=='modalMask')return;$('modalMask').classList.remove('show');_modalCb=null}
function modalCancel(){$('modalMask').classList.remove('show');_modalCb=null}
function modalConfirm(){const cb=_modalCb;$('modalMask').classList.remove('show');_modalCb=null;if(cb)cb()}
function todayKey(){return new Date().toISOString().slice(0,10)}
function vibrate(p){if(navigator.vibrate)try{navigator.vibrate(p)}catch(e){}}
function shuffled(arr){return [...arr].sort(()=>Math.random()-.5)}

/* Quita palabras con la misma traducción al español o el mismo icono.
   Se queda con la primera ocurrencia. */
function dedupOptions(words){
  const seenEs=new Set(), seenIc=new Set(), out=[];
  for(const w of words){
    if(seenEs.has(w.es)||seenIc.has(w.icon))continue;
    seenEs.add(w.es);seenIc.add(w.icon);
    out.push(w);
  }
  return out;
}
function escapeAttr(s){return String(s).replace(/'/g,'&#39;').replace(/"/g,'&quot;').replace(/\\/g,'\\\\')}

/* === TWEMOJI HELPERS ===
   Convierte cualquier emoji a una imagen SVG de Twemoji (CDN gratuito).
   Se ven IGUAL en todos los dispositivos y son más expresivos.
*/
const TWEMOJI_BASE='https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/';
function emojiToCodepoint(emoji){
  // Convertir emoji a codepoint hex tipo "1f44b" o "1f44b-1f3fb" para emojis con modificador
  const codepoints=[];
  let i=0;
  // Eliminar variation selector (FE0F) y zero-width joiner para algunos emojis simples
  const stripped=Array.from(emoji);
  for(const ch of stripped){
    const cp=ch.codePointAt(0);
    if(cp===0xFE0F)continue; // skip variation selector for simple emojis
    codepoints.push(cp.toString(16));
  }
  return codepoints.join('-');
}
function tw(emoji,size){
  // Devuelve un <img> de Twemoji o el emoji original como fallback
  if(!emoji||typeof emoji!=='string')return emoji||'';
  // Si ya es HTML (un dibujo SVG), devolver tal cual
  if(emoji.startsWith('<'))return emoji;
  const cp=emojiToCodepoint(emoji);
  if(!cp)return emoji;
  const url=TWEMOJI_BASE+cp+'.svg';
  const sizeAttr=size?` style="width:${size};height:${size}"`:'';
  return `<img class="tw" src="${url}" alt="${emoji}" draggable="false" onerror="this.replaceWith(document.createTextNode('${emoji}'))"${sizeAttr}>`;
}

function colorVisual(en,size){
  const c=COLOR_MAP[en]||'#6d5df6';
  const px=size||90;
  // White es muy claro, agregar borde
  const border=en==='White'?'border:3px solid #cbd5e1;':'';
  return `<div style="width:${px}px;height:${px}px;border-radius:50%;background:${c};${border}box-shadow:inset -8px -10px 18px #00000033,0 4px 12px #00000022"></div>`;
}

/* ============================================================
   AUDIO MEJORADO
   - Voces priorizadas con detección de calidad
   - Cola de utterances para no cortarse
   - Velocidad ajustable (lenta/normal)
   - Pre-warm para evitar primer-use lag
   ============================================================ */
let cachedVoices=[];
let voicesReady=false;
let speechQueue=[];
let speaking=false;

function refreshVoices(){
  if(!('speechSynthesis'in window))return;
  cachedVoices=window.speechSynthesis.getVoices()||[];
  voicesReady=cachedVoices.length>0;
}
if('speechSynthesis'in window){
  refreshVoices();
  window.speechSynthesis.onvoiceschanged=()=>{refreshVoices()};
}

function bestVoiceFor(lang){
  refreshVoices();
  const target=lang.toLowerCase();
  const prefix=target.slice(0,2);

  // Si el usuario eligió una voz específica
  if(prefs.voiceURI){
    const u=cachedVoices.find(v=>v.voiceURI===prefs.voiceURI&&v.lang.toLowerCase().startsWith(prefix));
    if(u)return u;
  }

  // Inglés: priorizar voces de alta calidad para niños
  if(prefix==='en'){
    const pri=['Samantha','Google US English','Microsoft Aria','Microsoft Jenny','Google UK English Female','Karen','Moira','Tessa','Microsoft Zira','Daniel','Alex'];
    for(const name of pri){
      const v=cachedVoices.find(v=>v.name&&v.name.includes(name)&&v.lang.toLowerCase().startsWith('en'));
      if(v)return v;
    }
    // Cualquier voz en-US o en-GB
    const usgb=cachedVoices.find(v=>['en-us','en-gb'].includes(v.lang.toLowerCase()));
    if(usgb)return usgb;
    const en=cachedVoices.find(v=>v.lang&&v.lang.toLowerCase().startsWith('en'));
    if(en)return en;
  }

  // Español: priorizar Chile, luego latam, luego cualquiera
  if(prefix==='es'){
    const pri=['es-cl','es-419','es-mx','es-us','es-co','es-ar','es-pe'];
    for(const code of pri){
      const v=cachedVoices.find(v=>v.lang.toLowerCase()===code);
      if(v)return v;
    }
    const es=cachedVoices.find(v=>v.lang&&v.lang.toLowerCase().startsWith('es'));
    if(es)return es;
  }

  return cachedVoices.find(v=>v.lang.toLowerCase().startsWith(prefix))||null;
}

// Cola para no cortarse cuando se llaman varios speak() seguidos
function speak(text,lang='en-US',rateOverride=null){
  return new Promise(resolve=>{
    speechQueue.push({text,lang,rateOverride,resolve});
    if(!speaking)processSpeechQueue();
  });
}
async function processSpeechQueue(){
  if(speaking||speechQueue.length===0)return;
  speaking=true;
  const item=speechQueue.shift();
  try{
    if(!('speechSynthesis'in window)){toast(item.text);item.resolve();speaking=false;processSpeechQueue();return}

    // Esperar a que las voces estén listas (max 1s)
    if(!voicesReady){
      for(let i=0;i<10&&!voicesReady;i++){await new Promise(r=>setTimeout(r,100));refreshVoices()}
    }

    speechSynthesis.cancel();
    await new Promise(r=>setTimeout(r,30)); // pequeño delay tras cancel

    const u=new SpeechSynthesisUtterance(item.text);
    u.lang=item.lang;
    const v=bestVoiceFor(item.lang);
    if(v)u.voice=v;
    // Ajuste de velocidad: lenta para niños aprendiendo
    let rate=item.rateOverride;
    if(!rate){
      if(item.lang.startsWith('en'))rate=prefs.slow?.55:.78;
      else rate=prefs.slow?.75:.95;
    }
    u.rate=rate;
    u.pitch=item.lang.startsWith('en')?1.08:1.12;
    u.volume=1;
    let resolved=false;
    const finish=()=>{if(!resolved){resolved=true;item.resolve();speaking=false;setTimeout(processSpeechQueue,50)}};
    u.onend=finish;
    u.onerror=finish;
    speechSynthesis.speak(u);
    // Safety: si no responde en 6s, continuar
    setTimeout(finish,6000+text.length*60);
  }catch(e){item.resolve();speaking=false;processSpeechQueue()}
}

function speakEN(text,rate){return speak(text,'en-US',rate)}
function speakES(text,rate){return speak(text,'es-CL',rate)}

// Reproduce una palabra/frase 2 veces para reforzar
async function speakENtwice(text){
  await speakEN(text);
  await new Promise(r=>setTimeout(r,300));
  await speakEN(text);
}

// Frase mixta: marcadores [[en]]...[[/en]] dentro de español
async function speakMixed(text){
  if(!text.includes('[[en]]'))return speakES(text);
  const parts=text.split(/(\[\[en\]\][\s\S]*?\[\[\/en\]\])/g).filter(Boolean);
  for(const p of parts){
    if(p.startsWith('[[en]]')){
      const inner=p.replace(/^\[\[en\]\]/,'').replace(/\[\[\/en\]\]$/,'').trim();
      if(inner)await speakEN(inner);
    }else{
      const t=p.trim();
      if(t)await speakES(t);
    }
  }
}

/* === SOUND EFFECTS === */
let audioCtx=null;
function getCtx(){if(!audioCtx){try{audioCtx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}return audioCtx}
function playTone(freq,duration=120,type='sine',vol=.18){
  const ctx=getCtx();if(!ctx)return;
  try{
    const osc=ctx.createOscillator();const g=ctx.createGain();
    osc.type=type;osc.frequency.value=freq;
    g.gain.value=vol;g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+duration/1000);
    osc.connect(g);g.connect(ctx.destination);
    osc.start();osc.stop(ctx.currentTime+duration/1000);
  }catch(e){}
}

function sfxTap(){playTone(440,60,'triangle',.1)}
function sfxLevelUp(){const notes=[523,659,784,1047];notes.forEach((f,i)=>setTimeout(()=>playTone(f,180,'sine',.18),i*120))}

function startLesson(id){
  currentLesson=LESSONS.find(l=>l.id===id);
  stepIndex=0;sessionScore=0;comboCount=0;
  lessonState={hearts:3,errors:0,startTime:Date.now()};
  showStep();
  speakES('Lección: '+currentLesson.title).then(()=>setTimeout(()=>speakEN("Let's learn "+currentLesson.titleEn+"!"),200));
}

function stepsForLesson(){
  // Metodología Duolingo ABC para niños 6-8 años:
  // 1. INTRODUCCIÓN: Cada palabra como flashcard grande con audio doble
  // 2. RECONOCIMIENTO: Picture Match (sin texto) - tocar la imagen correcta
  // 3. EJERCICIO: Tap to Hear - escuchar y asociar
  // 4. JUEGO: Balloon Pop - mecánica visual atractiva
  // 5. PRÁCTICA: Memorice imagen-imagen (NO TEXTO)
  // 6. APLICACIÓN: Diálogo / Sort / Speed
  // 7. RECOMPENSA: Cofre + medalla
  const steps=[];
  const words=currentLesson.words;
  // Fase 1: Introducción visual (1 flashcard por palabra)
  for(let i=0;i<words.length;i++){
    steps.push({type:'flash',idx:i});
    // Mini test cada 2 palabras (Picture Match - sin texto)
    if((i+1)%2===0&&i<words.length-1){
      steps.push({type:'picmatch'});
    }
  }
  // Fase 2: Juegos visuales (sin depender de leer)
  steps.push({type:'taphear'});       // Toca y escucha
  steps.push({type:'picmatch'});      // Otro Picture Match
  steps.push({type:'balloon'});        // Pop the Balloon
  steps.push({type:'match'});          // Memorice IMAGEN-IMAGEN
  // Fase 3: Práctica con texto solo si la lección tiene
  if(currentLesson.phrases&&currentLesson.phrases.length)steps.push({type:'sentence'});
  // Fase 4: Especiales
  if(currentLesson.sortItems)steps.push({type:'sort'});
  if(currentLesson.dialog&&currentLesson.dialog.length)steps.push({type:'dialog'});
  if(['greetings','about-me','classroom','healthy-habits'].includes(currentLesson.id))steps.push({type:'speed'});
  steps.push({type:'complete'});
  return steps;
}

function showStep(){
  const steps=stepsForLesson();
  const step=steps[stepIndex];
  const pct=Math.round(((stepIndex+1)/steps.length)*100);
  const hearts=lessonState?.hearts??3;
  $('content').innerHTML=`<div class="activity">
    <div class="activity-progress">
      <button class="progress-close" onclick="exitLesson()" aria-label="Salir">✕</button>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="progress-hearts">❤️ ${hearts}</div>
    </div>
    <div id="activityBody"></div>
  </div>`;
  if(step.type==='flash')renderFlash(step.idx);
  else if(step.type==='micro')renderMicroQuiz(step.from,step.to);
  else if(step.type==='listen')renderListenGame();
  else if(step.type==='picmatch')renderPictureMatch();
  else if(step.type==='taphear')renderTapToHear();
  else if(step.type==='balloon')renderBalloonGame();
  else if(step.type==='repeat')renderRepeatGame();
  else if(step.type==='tap')renderTapGame();
  else if(step.type==='match')renderImageMemory();
  else if(step.type==='sentence')renderSentenceGame();
  else if(step.type==='sort')renderSortGame();
  else if(step.type==='dialog')renderDialogGame();
  else if(step.type==='speed')renderSpeedGame();
  else if(step.type==='complete')renderComplete();
  updateStats();
}

/* === MICRO QUIZ: refuerzo inmediato después de 2 flashcards === */
function renderMicroQuiz(from,to){
  const candidates=currentLesson.words.slice(Math.max(0,from-1),to+1);
  const pool=candidates.length>=2?candidates:currentLesson.words.slice(0,Math.min(3,currentLesson.words.length));
  const correct=pool[Math.floor(Math.random()*pool.length)];
  // Distractores que NO comparten es ni icon con la correcta
  const others=currentLesson.words.filter(w=>w.en!==correct.en&&w.es!==correct.es&&w.icon!==correct.icon);
  const distractors=dedupOptions(shuffled(others)).slice(0,Math.min(2,others.length));
  const opts=shuffled([correct,...distractors]);
  window._mqCorrect=correct.en;
  $('activityBody').innerHTML=`<section class="card">
    <div class="question">¿Qué escuchaste? <small>Listen and pick the picture</small></div>
    <button class="primary-btn full" onclick="speakENtwice('${escapeAttr(correct.en)}')">🔊 Escuchar otra vez</button>
    <div class="options" style="grid-template-columns:repeat(${opts.length},1fr);margin-top:12px">${opts.map(v=>`<button class="option" onclick="answerMicro(this,'${escapeAttr(v.en)}','${escapeAttr(v.es)}')"><span class="ic">${tw(v.icon)}</span><span class="lbl-es">${v.es}</span></button>`).join('')}</div>

  setTimeout(()=>speakENtwice(correct.en),250);
}

/* === BALLOON POP === Globos con imágenes suben, niño revienta el correcto */
let balloonState=null;
function renderBalloonGame(){
  const items=dedupOptions(shuffled(currentLesson.words)).slice(0,Math.min(5,currentLesson.words.length));
  balloonState={
    items,target:items[Math.floor(Math.random()*items.length)],
    score:0,rounds:0,totalRounds:5,balloons:[],spawnTimer:null,roundActive:false
  };
  startBalloonRound();
}
function startBalloonRound(){
  if(!balloonState)return;
  if(balloonState.rounds>=balloonState.totalRounds){endBalloonGame();return}
  balloonState.rounds++;
  balloonState.target=balloonState.items[Math.floor(Math.random()*balloonState.items.length)];
  balloonState.roundActive=true;
  balloonState.balloons=[];
  const targetVisual=isColorLesson()?
    `<div style="width:60px;height:60px;border-radius:50%;background:${COLOR_MAP[balloonState.target.en]||'#888'};border:3px solid #fff;box-shadow:0 4px 12px #0002"></div>`:
    `<div style="width:60px;height:60px;border-radius:18px;background:#fff;display:grid;place-items:center;box-shadow:0 4px 12px #0002">${tw(balloonState.target.icon,'42px')}</div>`;
  $('activityBody').innerHTML=`
    <div style="background:#fff;border-radius:20px;padding:14px;display:flex;align-items:center;gap:14px;box-shadow:0 6px 16px #1720331a;margin-bottom:10px">
      ${targetVisual}
      <div style="flex:1;min-width:0">
        <div style="font-size:.78rem;color:var(--muted);font-weight:900;text-transform:uppercase;letter-spacing:.05em">Pincha el globo de:</div>
        <div style="font-size:1.4rem;font-weight:1000;line-height:1.05;letter-spacing:-.02em">${balloonState.target.es}</div>
        <div style="font-size:.95rem;color:var(--primary);font-weight:900">${balloonState.target.en}</div>
      </div>
      <button onclick="speakENtwice('${escapeAttr(balloonState.target.en)}')" style="background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;border-radius:14px;width:50px;height:50px;font-size:1.4rem;border:0;flex-shrink:0;box-shadow:0 4px 10px #6d5df633" aria-label="Escuchar">🔊</button>
    </div>
    <div style="text-align:center;margin-bottom:8px;font-weight:1000;color:var(--ink)"><span style="background:#fef3c7;padding:4px 10px;border-radius:12px">⭐ ${balloonState.score}</span> · Ronda ${balloonState.rounds}/${balloonState.totalRounds}</div>
    <div class="balloon-arena" id="balloonArena"></div>
    <div class="action-bar"><button class="ghost-btn" onclick="endBalloonGame(true)">⏭️ Saltar juego</button></div>`;
  setTimeout(()=>speakENtwice(balloonState.target.en),200);
  let count=0;
  balloonState.spawnTimer=setInterval(()=>{
    if(!balloonState||!balloonState.roundActive)return;
    spawnBalloon();
    count++;
    if(count>=7){clearInterval(balloonState.spawnTimer);setTimeout(()=>{
      if(balloonState&&balloonState.roundActive){
        balloonState.roundActive=false;
        setTimeout(()=>startBalloonRound(),800);
      }
    },5000)}
  },1000);
}
function spawnBalloon(){
  const arena=$('balloonArena');
  if(!arena||!balloonState)return;
  const useCorrect=Math.random()<0.55;
  const word=useCorrect?balloonState.target:balloonState.items.filter(w=>w.en!==balloonState.target.en)[Math.floor(Math.random()*Math.max(1,balloonState.items.length-1))];
  if(!word)return;
  const colors=isColorLesson();
  let bgColor;
  if(colors){
    bgColor=COLOR_MAP[word.en]||'#6d5df6';
  }else{
    const palette=['#ef4444','#f59e0b','#3b82f6','#a855f7','#ec4899','#14b8a6','#22c55e','#f97316'];
    let hash=0;
    for(let i=0;i<word.en.length;i++)hash=word.en.charCodeAt(i)+((hash<<5)-hash);
    bgColor=palette[Math.abs(hash)%palette.length];
  }
  const xPct=8+Math.random()*78;
  const duration=4.5+Math.random()*1.5;
  const balloon=document.createElement('div');
  balloon.className='balloon'+(colors?' color-lesson':'');
  balloon.style.left=xPct+'%';
  balloon.style.animationDuration=duration+'s';
  balloon.dataset.word=word.en;
  // En lecciones de colores, no mostrar icono — el color del globo es la respuesta
  const iconHtml=colors?'':tw(word.icon,'54px');
  balloon.innerHTML=`<div class="balloon-body" style="color:${bgColor}">${iconHtml}</div><div class="balloon-string"></div><div class="balloon-label">${word.es}</div>`;
  balloon.onclick=()=>popBalloon(balloon,word.en);
  arena.appendChild(balloon);
  setTimeout(()=>{if(balloon.parentNode){balloon.classList.add('missed');setTimeout(()=>balloon.remove(),400)}},(duration*1000)+200);
}
async function popBalloon(el,word){
  if(!balloonState)return;
  const ok=word===balloonState.target.en;
  el.classList.add('popped');
  if(ok){
    sfxCorrect();vibrate([20,40,20]);
    balloonState.score+=10;reward(8);comboCount++;
    if(comboCount>=3)showComboBanner('🔥 '+comboCount+'x');
  }else{
    sfxWrong();vibrate(120);comboCount=0;loseHeart();
  }
  setTimeout(()=>el.remove(),350);
}
function endBalloonGame(skip){
  if(balloonState&&balloonState.spawnTimer)clearInterval(balloonState.spawnTimer);
  const score=balloonState?balloonState.score:0;
  balloonState=null;
  if(skip){nextStep();return}
  $('activityBody').innerHTML=`
    <div class="mascot-stage"><div class="mascot celebrate"><div class="mascot-body">🦉</div></div>
    <div class="speech-bubble right">¡Increíble!<br><small>Amazing!</small></div></div>
    <div style="text-align:center;padding:20px">

      <h2 style="font-size:1.4rem;margin-top:8px">¡Globos reventados!</h2>
      <div style="margin-top:12px;background:#fff;display:inline-block;padding:10px 22px;border-radius:18px;box-shadow:0 4px 12px #1720331a"><b style="font-size:1.6rem;color:var(--primary)">⭐ ${score}</b></div>

    <div class="action-bar"><button class="primary-btn" onclick="nextStep()">Continuar →</button></div>`;
  if(score>=30){confetti();sfxLevelUp()}
}

function resetSentence(){
  if(!sentenceState)return;
  sentenceState.chosen=[];
  document.querySelectorAll('#tiles .tile').forEach(t=>{t.disabled=false;t.style.opacity=1});
  $('drop').innerHTML='Toca las palabras abajo';
  sfxTap();
}
async function pickTile(el,t){
  sentenceState.chosen.push(t);el.disabled=true;el.style.opacity=.35;sfxTap();
  $('drop').innerHTML=sentenceState.chosen.map(x=>`<span class="tile">${x}</span>`).join('');
  if(sentenceState.chosen.length===sentenceState.target.split(' ').length){
    const built=sentenceState.chosen.join(' ');
    const ok=built===sentenceState.target;
    sentenceState.attempts=(sentenceState.attempts||0)+1;
    showFeedback(ok,ok?'¡Frase correcta!':'Revisa el orden.');
    if(ok){
      reward(15);sfxCorrect();vibrate([20,40,20]);
      hideHelpPanel();
      await speakEN(sentenceState.target);confetti();
      setTimeout(()=>nextStep(),1800);
    }else{
      sfxWrong();vibrate(150);comboCount=0;
      await speakES('Casi.');await speakEN(sentenceState.target);
      // Tras 1 error: ofrecer ver respuesta o reintentar
      if(sentenceState.attempts>=2){
        // 2 errores: mostrar respuesta + botón continuar
        $('drop').innerHTML=sentenceState.target.split(' ').map(x=>`<span class="tile" style="background:#dcfce7;color:#087f5b">${x}</span>`).join('');
        showHelpPanel('La frase correcta era: <b>'+sentenceState.target+'</b>',{
          showAnswer:{label:'✅ Continuar',fn:()=>{hideHelpPanel();nextStep()}}
        });
      }else{
        // 1er error: solo permitir reintentar (sin cambiar la frase)
        showHelpPanel('Intenta de nuevo. La frase es: <b>'+sentenceState.targetEs+'</b>',{
          retry:{label:'🔁 Reintentar',fn:()=>{hideHelpPanel();sentenceState.chosen=[];document.querySelectorAll('#tiles .tile').forEach(t=>{t.disabled=false;t.style.opacity=1});$('drop').innerHTML='Toca las palabras abajo';showFeedback(false,'')}},
          showAnswer:{label:'✅ Saltar',fn:()=>{hideHelpPanel();nextStep()}}
        });
      }
    }
  }
}

function speedNextRound(){

async function speedAnswer(el,key){

/* === Animación de gemas volando hacia el contador === */
function spawnGems(amount){
  const target=$('stars');
  if(!target)return;
  const tRect=target.getBoundingClientRect();
  // Spawn desde el centro de la pantalla
  const startX=window.innerWidth/2;
  const startY=window.innerHeight/2;
  const count=Math.min(5,Math.max(1,Math.floor(amount/5)));
  for(let i=0;i<count;i++){
    setTimeout(()=>{
      const g=document.createElement('div');
      g.className='gem-fly';
      g.textContent='💎';
      g.style.left=startX+(Math.random()*60-30)+'px';
      g.style.top=startY+'px';
      const dx=tRect.left-startX;
      const dy=tRect.top-startY;
      g.style.setProperty('--dx',dx+'px');
      g.style.setProperty('--dy',dy+'px');
      document.body.appendChild(g);
      setTimeout(()=>g.remove(),1000);
    },i*80);
  }
  // XP popup
  const xp=document.createElement('div');
  xp.className='xp-popup';
  xp.textContent='+'+amount+' XP';
  xp.style.left='50%';
  xp.style.top='40%';
  xp.style.transform='translateX(-50%)';
  xp.style.position='fixed';
  document.body.appendChild(xp);
  setTimeout(()=>xp.remove(),1400);
}

/* Panel de ayuda inline tras errores - aparece JUNTO a la pregunta, no abajo */
window._helpHandlers={};
function showHelpPanel(msg, options){
  // options: {showAnswer:{label, fn}, skip:{...}, retry:{...}}
  let p=$('helpPanel');
  if(!p){
    p=document.createElement('div');
    p.id='helpPanel';
    p.className='help-panel';
    const fb=$('feedback');
    if(fb&&fb.parentNode)fb.parentNode.insertBefore(p,fb.nextSibling);
    else{const ab=$('activityBody');if(ab)ab.appendChild(p)}
  }
  // Guardar handlers en _helpHandlers para poder llamarlos desde onclick
  window._helpHandlers={};
  let btnsHtml='';
  if(options.showAnswer){window._helpHandlers.showAnswer=options.showAnswer.fn;btnsHtml+=`<button class="show-answer" onclick="window._helpHandlers.showAnswer&&window._helpHandlers.showAnswer()">${options.showAnswer.label||'👁️ Ver respuesta'}</button>`}
  if(options.skip){window._helpHandlers.skip=options.skip.fn;btnsHtml+=`<button class="skip" onclick="window._helpHandlers.skip&&window._helpHandlers.skip()">${options.skip.label||'⏭️ Saltar'}</button>`}
  if(options.retry){window._helpHandlers.retry=options.retry.fn;btnsHtml+=`<button class="skip" onclick="window._helpHandlers.retry&&window._helpHandlers.retry()">${options.retry.label||'🔁 Intentar otra vez'}</button>`}
  p.innerHTML=`<div class="msg">${msg}</div><div class="btns">${btnsHtml}</div>`;
  p.classList.remove('hidden');
  // Hacer scroll al panel para que sea visible
  setTimeout(()=>p.scrollIntoView({behavior:'smooth',block:'center'}),100);
}
function hideHelpPanel(){const p=$('helpPanel');if(p){p.classList.add('hidden');p.innerHTML=''}window._helpHandlers={}}
