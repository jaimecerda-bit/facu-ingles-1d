<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="FACU INGLÉS 1D - Plataforma profesional de aprendizaje de inglés para niños">
    <meta name="theme-color" content="#6366f1">
    <title>FACU INGLÉS 1D - Professional Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6366f1;
            --secondary: #ec4899;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --dark: #1f2937;
            --light: #f3f4f6;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        .animated-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .floating-shape {
            position: absolute;
            opacity: 0.1;
            animation: float 20s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(100px, -100px) rotate(90deg); }
            50% { transform: translate(200px, 50px) rotate(180deg); }
            75% { transform: translate(-50px, 100px) rotate(270deg); }
        }

        .shape-1 { top: 10%; left: 10%; font-size: 100px; animation-delay: 0s; }
        .shape-2 { top: 60%; left: 70%; font-size: 80px; animation-delay: 2s; }
        .shape-3 { top: 30%; left: 80%; font-size: 120px; animation-delay: 4s; }
        .shape-4 { top: 70%; left: 20%; font-size: 90px; animation-delay: 6s; }

        .audio-helper {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 90px;
            height: 90px;
            background: linear-gradient(135deg, var(--secondary), var(--danger));
            border-radius: 50%;
            border: 5px solid white;
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
            cursor: pointer;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5em;
            animation: pulse 2s infinite;
            transition: all 0.3s;
        }

        .audio-helper:hover {
            transform: scale(1.2);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .audio-helper.speaking {
            animation: wave 0.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        @keyframes wave {
            0%, 100% { transform: scale(1) rotate(0deg); }
            25% { transform: scale(1.15) rotate(-10deg); }
            75% { transform: scale(1.15) rotate(10deg); }
        }

        .voice-indicator {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255,255,255,0.95);
            padding: 15px 30px;
            border-radius: 50px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            display: none;
            align-items: center;
            gap: 15px;
            z-index: 1001;
            font-size: 1.2em;
            font-weight: 600;
        }

        .voice-indicator.active {
            display: flex;
            animation: slideDown 0.3s;
        }

        @keyframes slideDown {
            from { transform: translateX(-50%) translateY(-100px); opacity: 0; }
            to { transform: translateX(-50%) translateY(0); opacity: 1; }
        }

        .voice-wave {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .voice-bar {
            width: 4px;
            height: 20px;
            background: var(--primary);
            border-radius: 2px;
            animation: wave-bar 0.5s infinite alternate;
        }

        .voice-bar:nth-child(2) { animation-delay: 0.1s; }
        .voice-bar:nth-child(3) { animation-delay: 0.2s; }
        .voice-bar:nth-child(4) { animation-delay: 0.3s; }

        @keyframes wave-bar {
            from { height: 10px; }
            to { height: 30px; }
        }

        .login-screen {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-container {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-radius: 40px;
            padding: 50px;
            max-width: 900px;
            width: 100%;
            box-shadow: 0 30px 80px rgba(0,0,0,0.3);
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .logo {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo-icon {
            font-size: 8em;
            display: inline-block;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .logo h1 {
            font-family: 'Fredoka One', cursive;
            font-size: 3.5em;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 20px 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .subtitle {
            text-align: center;
            color: var(--dark);
            font-size: 1.4em;
            margin-bottom: 40px;
            font-weight: 600;
        }

        .users-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .user-card {
            background: linear-gradient(135deg, #fff, #f0f0ff);
            padding: 30px;
            border-radius: 25px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            border: 4px solid transparent;
            position: relative;
            overflow: hidden;
        }

        .user-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 0;
        }

        .user-card:hover::before {
            opacity: 0.1;
        }

        .user-card:hover {
            transform: translateY(-10px) scale(1.05);
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            border-color: var(--primary);
        }

        .user-card > * {
            position: relative;
            z-index: 1;
        }

        .user-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4em;
            margin: 0 auto 20px;
            border: 5px solid white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            animation: bounce 3s infinite;
        }

        .user-name {
            font-size: 1.4em;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 10px;
        }

        .user-stats {
            background: white;
            padding: 10px;
            border-radius: 15px;
            font-size: 1.1em;
            display: flex;
            justify-content: space-around;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .delete-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 40px;
            height: 40px;
            background: var(--danger);
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.5em;
            font-weight: bold;
            display: none;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transition: all 0.3s;
            z-index: 2;
        }

        .user-card:hover .delete-btn {
            display: block;
        }

        .delete-btn:hover {
            transform: scale(1.2) rotate(90deg);
        }

        .new-user-form {
            background: linear-gradient(135deg, #e0f2fe, #ddd6fe);
            padding: 40px;
            border-radius: 30px;
            border: 5px dashed var(--primary);
        }

        .form-title {
            text-align: center;
            font-size: 2em;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 30px;
        }

        .input-label {
            font-size: 1.3em;
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 15px;
            display: block;
            text-align: center;
        }

        #userName {
            width: 100%;
            padding: 20px;
            font-size: 1.5em;
            border: 4px solid var(--primary);
            border-radius: 20px;
            text-align: center;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s;
        }

        #userName:focus {
            outline: none;
            border-color: var(--secondary);
            box-shadow: 0 0 30px rgba(236, 72, 153, 0.3);
            transform: scale(1.02);
        }

        .avatar-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .avatar-option {
            aspect-ratio: 1;
            background: white;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3em;
            cursor: pointer;
            border: 4px solid transparent;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .avatar-option::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            opacity: 0;
            transition: opacity 0.3s;
        }

        .avatar-option:hover::before {
            opacity: 0.2;
        }

        .avatar-option:hover {
            transform: scale(1.15) rotate(5deg);
            border-color: var(--primary);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .avatar-option.selected {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-color: var(--secondary);
            transform: scale(1.2);
            animation: pulse 1s infinite;
        }

        .avatar-option > span {
            position: relative;
            z-index: 1;
        }

        .avatar-option.selected > span {
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.3));
        }

        .create-btn {
            width: 100%;
            padding: 25px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 2em;
            font-weight: 700;
            cursor: pointer;
            margin-top: 30px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
            transition: all 0.3s;
            font-family: 'Fredoka One', cursive;
        }

        .create-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
        }

        .create-btn:active {
            transform: scale(0.95);
        }

        .app-screen {
            display: none;
            position: relative;
            z-index: 1;
            min-height: 100vh;
            padding: 20px;
        }

        .app-container {
            max-width: 1400px;
            margin: 0 auto;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-radius: 40px;
            overflow: hidden;
            box-shadow: 0 30px 80px rgba(0,0,0,0.3);
        }

        .app-header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 40px;
            position: relative;
            overflow: hidden;
        }

        .app-header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -10%;
            width: 500px;
            height: 500px;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
        }

        .user-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
            position: relative;
            z-index: 1;
            flex-wrap: wrap;
            gap: 20px;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .profile-avatar {
            width: 80px;
            height: 80px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3em;
            border: 5px solid rgba(255,255,255,0.5);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            animation: bounce 3s infinite;
        }

        .profile-info h2 {
            font-size: 2em;
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .logout-btn {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 3px solid white;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 1.3em;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
        }

        .logout-btn:hover {
            background: white;
            color: var(--primary);
            transform: scale(1.1);
        }

        .app-title {
            text-align: center;
            font-family: 'Fredoka One', cursive;
            font-size: 3em;
            margin: 20px 0;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.2);
            position: relative;
            z-index: 1;
        }

        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
            position: relative;
            z-index: 1;
        }

        .stat-card {
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            border: 2px solid rgba(255,255,255,0.3);
        }

        .stat-value {
            font-size: 3em;
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .stat-label {
            font-size: 1.2em;
            margin-top: 10px;
            font-weight: 600;
        }

        .app-content {
            padding: 50px;
        }

        .lessons-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 35px;
        }

        .lesson-card {
            background: linear-gradient(135deg, #fff, #f8f9ff);
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            border: 5px solid transparent;
            position: relative;
            overflow: hidden;
        }

        .lesson-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            opacity: 0;
            transition: opacity 0.3s;
        }

        .lesson-card:hover::before {
            opacity: 0.1;
        }

        .lesson-card:hover {
            transform: translateY(-15px);
            box-shadow: 0 25px 60px rgba(0,0,0,0.3);
            border-color: var(--primary);
        }

        .lesson-card.completed {
            background: linear-gradient(135deg, #d1fae5, #a7f3d0);
            border-color: var(--success);
        }

        .lesson-card.locked {
            opacity: 0.5;
            cursor: not-allowed;
            filter: grayscale(100%);
        }

        .lesson-card > * {
            position: relative;
            z-index: 1;
        }

        .lesson-icon {
            font-size: 6em;
            margin-bottom: 25px;
            display: inline-block;
            animation: bounce 3s infinite;
        }

        .lesson-title {
            font-size: 2em;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 15px;
        }

        .lesson-subtitle {
            font-size: 1.3em;
            color: #6b7280;
            margin-bottom: 20px;
        }

        .lesson-progress {
            background: white;
            padding: 12px;
            border-radius: 15px;
            font-size: 1.1em;
            font-weight: 600;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .badge {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 3.5em;
            animation: pulse 2s infinite;
        }

        .vocab-display {
            max-width: 900px;
            margin: 0 auto;
        }

        .vocab-card {
            background: linear-gradient(135deg, #fef3c7, #fde68a);
            padding: 60px;
            border-radius: 40px;
            text-align: center;
            border: 8px solid var(--warning);
            margin-bottom: 40px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        }

        .vocab-card:hover {
            transform: scale(1.03);
            box-shadow: 0 30px 80px rgba(0,0,0,0.3);
        }

        .vocab-illustration {
            font-size: 10em;
            margin-bottom: 30px;
            display: inline-block;
            animation: bounce 2s infinite;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.2));
        }

        .vocab-word {
            font-size: 4em;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .vocab-phonetic {
            font-size: 2em;
            color: #6b7280;
            font-style: italic;
            background: white;
            padding: 15px 30px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .vocab-translation {
            font-size: 2.5em;
            color: var(--dark);
            font-weight: 600;
            margin-bottom: 30px;
        }

        .speak-button {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 25px 60px;
            border-radius: 30px;
            font-size: 2em;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
            transition: all 0.3s;
            font-family: 'Fredoka One', cursive;
        }

        .speak-button:hover {
            transform: scale(1.1);
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
        }

        .quiz-question {
            text-align: center;
            font-size: 2.5em;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 30px;
        }

        .quiz-icon {
            font-size: 8em;
            margin: 30px 0;
            display: inline-block;
            animation: bounce 2s infinite;
        }

        .quiz-hint {
            text-align: center;
            font-size: 1.5em;
            color: #6b7280;
            margin-bottom: 40px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
            max-width: 900px;
            margin: 0 auto;
        }

        .option-card {
            background: white;
            padding: 40px;
            border-radius: 25px;
            border: 5px solid #e5e7eb;
            font-size: 1.8em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .option-card:hover {
            border-color: var(--primary);
            transform: translateY(-10px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
        }

        .option-card.correct {
            background: linear-gradient(135deg, #d1fae5, #a7f3d0);
            border-color: var(--success);
            animation: correctPulse 0.5s 3;
        }

        .option-card.incorrect {
            background: linear-gradient(135deg, #fee2e2, #fecaca);
            border-color: var(--danger);
            animation: shake 0.5s;
        }

        @keyframes correctPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-15px); }
            75% { transform: translateX(15px); }
        }

        .memory-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            max-width: 700px;
            margin: 40px auto;
        }

        .memory-card {
            aspect-ratio: 1;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3em;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            position: relative;
        }

        .memory-card:hover {
            transform: scale(1.05);
        }

        .memory-card.flipped {
            background: white;
            color: var(--dark);
            border: 5px solid var(--primary);
        }

        .memory-card.matched {
            background: linear-gradient(135deg, #d1fae5, #a7f3d0);
            color: var(--success);
            cursor: default;
        }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 50px;
            gap: 20px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 20px 50px;
            border: none;
            border-radius: 25px;
            font-size: 1.6em;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            font-family: 'Poppins', sans-serif;
        }

        .btn-back {
            background: linear-gradient(135deg, #f3f4f6, #e5e7eb);
            color: var(--dark);
        }

        .btn-next {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .feedback-banner {
            text-align: center;
            padding: 35px;
            border-radius: 25px;
            font-size: 2.5em;
            font-weight: 700;
            margin: 40px 0;
            display: none;
            animation: slideDown 0.5s;
        }

        .feedback-banner.show {
            display: block;
        }

        .feedback-banner.success {
            background: linear-gradient(135deg, #d1fae5, #a7f3d0);
            color: var(--success);
            border: 5px solid var(--success);
        }

        .feedback-banner.error {
            background: linear-gradient(135deg, #fee2e2, #fecaca);
            color: var(--danger);
            border: 5px solid var(--danger);
        }

        .completion {
            text-align: center;
            padding: 60px;
        }

        .completion-icon {
            font-size: 12em;
            margin: 30px 0;
            display: inline-block;
            animation: bounce 1s infinite;
        }

        .completion-title {
            font-family: 'Fredoka One', cursive;
            font-size: 4em;
            background: linear-gradient(135deg, var(--success), #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 30px;
        }

        .completion-score {
            font-size: 3em;
            font-weight: 700;
            color: var(--dark);
            margin: 30px 0;
        }

        .stars-display {
            font-size: 5em;
            margin: 30px 0;
        }

        .confetti-piece {
            position: fixed;
            width: 15px;
            height: 15px;
            animation: confetti-fall 3s linear;
            z-index: 999;
        }

        @keyframes confetti-fall {
            to {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }

        @media (max-width: 768px) {
            .logo h1 { font-size: 2.5em; }
            .avatar-grid { grid-template-columns: repeat(4, 1fr); }
            .options-grid { grid-template-columns: 1fr; }
            .memory-grid { grid-template-columns: repeat(3, 1fr); }
            .app-title { font-size: 2em; }
            .vocab-illustration { font-size: 6em; }
            .vocab-word { font-size: 2.5em; }
            .lesson-icon { font-size: 4em; }
        }

        @media (max-width: 480px) {
            .users-grid { grid-template-columns: repeat(2, 1fr); }
            .avatar-grid { grid-template-columns: repeat(3, 1fr); }
            .memory-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>

            <div class="voice-bar"></div>

        </div>
        <span id="voiceText">Speaking...</span>
    </div>

    <div class="login-screen" id="loginScreen">
        <div class="login-container">
            <div class="logo">
                <div class="logo-icon">📚</div>
                <h1>FACU INGLÉS 1D</h1>
                <p class="subtitle">🎯 Professional English Learning</p>
            </div>

            <div class="users-grid" id="usersGrid"></div>

            <div class="new-user-form">
                <h3 class="form-title">👤 Crear Nuevo Perfil</h3>
                
                <div class="input-group">
                    <label class="input-label">Escribe tu nombre:</label>
                    <input type="text" id="userName" placeholder="Tu nombre aquí..." maxlength="20">
                </div>

                <div class="input-group">
                    <label class="input-label">Elige tu avatar favorito:</label>
                    <div class="avatar-grid" id="avatarGrid"></div>
                </div>

                <button class="create-btn" onclick="createUser()">✨ CREAR PERFIL ✨</button>
            </div>
        </div>
    </div>

    <div class="app-screen" id="appScreen">
        <div class="app-container">
            <div class="app-header">
                <div class="user-bar">
                    <div class="user-profile">
                        <div class="profile-avatar" id="profileAvatar">👦</div>
                        <div class="profile-info">
                            <h2 id="profileName">Usuario</h2>
                        </div>
                    </div>

                <h1 class="app-title">FACU INGLÉS 1D</h1>

                <div class="stats-container">

                    </div>
                    <div class="stat-card">

                    </div>
                    <div class="stat-card">

                    <div class="stat-card">
                        <div class="stat-value" id="streakCount">0</div>
                        <div class="stat-label">🔥 RACHA</div>

                </div>

            <div class="app-content" id="appContent"></div>
        </div>
